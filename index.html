<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>THA BLOCK IS HOT</title>
  <!-- Site Favicon: Pixel-Art Flaming Earth Globe (Supports uploaded image_b3f92a.png + immediate self-contained pixel canvas fallback) -->
  <link id="site-favicon" rel="icon" type="image/png" href="image_b3f92a.png" />
  <link id="site-shortcut-icon" rel="shortcut icon" type="image/png" href="image_b3f92a.png" />
  <link id="site-apple-icon" rel="apple-touch-icon" type="image/png" href="image_b3f92a.png" />
  <script>
    (function initFlamingEarthFavicon() {
      const palette = {
        '.': null,
        'R': '#c84b20',
        'O': '#e57028',
        'Y': '#f7b538',
        'L': '#fce762',
        'D': '#16384c',
        'B': '#4ab3d6',
        'b': '#4ab3d6',
        'S': '#3b8ead',
        'H': '#8dd8ef',
        'G': '#78a842',
        'E': '#5c8731'
      };

      const rows = [
        "...............R................",
        "...............R................",
        "...............O........R.......",
        "...........R...O.......YO.......",
        ".....R.....OR.OYR..R...O..R.....",
        ".....OR....YO.OYO..OR....RO.....",
        "....ROY..R.OY.YLY.ROY...ROY.....",
        "....OYO.ROYOYYLYYROYO..ROYO.....",
        "....YLYROYLYYLLLLYYLYR.OYLY..R..",
        "....YLYOYLLLLLLLLLLLYOYLLYO.OY..",
        "..Y.OYYLLLLDDDDDDDDLLLLYYLY.Y...",
        "..O..YLLLLDDGGGGbbDDLLLLYYO.....",
        "....RYLLLDDGGGGGBBbbDDLLLYR.R...",
        "....OYLLDDBGGGGBBBBBEDDLLYO.OR..",
        "....YYLLDDHGGGBBBBBGGDDLLYYROY..",
        "....YLLLDDBBGBBBBBGGGEDDLLYYLY..",
        "....OYLLDDHBBBBBBGGGGEDDLLYLLY..",
        "....RYLLDDBGGGGBBGGGGEDDLLYLYO..",
        "....ROYLDDHGGGGGBBGGGEDDLLYYOR..",
        ".....OYLDDBBGGGGBBBGEDDLLLYYO...",
        ".....RYLLDDHBBGGBBBBBSDDLLYYR...",
        "......YLLLDDBBGBBBBBSSDDLLYYR...",
        "......OYLLDDSSBBBBBBSSDDLLYO....",
        ".......YLLLDDSSSSSSSSDDLLYYR.O..",
        ".......RYLLLDDDDDDDDDDLLLYO.....",
        "........OYLLLLLLLLLLLLLLYYR.....",
        ".........RYYLLLLLLLLLLYYOR......",
        "..........ROYYYYYYYYYYORR.......",
        "............RROOOOOORRR.........",
        "..............RRRRRRR...........",
        "................................",
        "................................"
      ];

      function generatePixelEarthDataURL() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        for (let y = 0; y < 32; y++) {
          const row = rows[y] || '';
          for (let x = 0; x < 32; x++) {
            const ch = row[x];
            const color = palette[ch];
            if (color) {
              ctx.fillStyle = color;
              ctx.fillRect(x * 2, y * 2, 2, 2);
            }
          }
        }
        return canvas.toDataURL('image/png');
      }

      const fallbackDataUrl = generatePixelEarthDataURL();
      const applyFaviconHref = (href) => {
        ['site-favicon', 'site-shortcut-icon', 'site-apple-icon'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.href = href;
        });
      };

      applyFaviconHref(fallbackDataUrl);

      const probeImg = new Image();
      probeImg.onload = () => applyFaviconHref('image_b3f92a.png');
      probeImg.src = 'image_b3f92a.png';
    })();
  </script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Orbitron, Share Tech Mono & Rajdhani (Futuristic Cyber Typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-pure-black: #000000;
      --inbound-neon: #ff0055;
      --inbound-neon-bright: #ff3377;
      --center-cyber: #ff9900;
      --center-cyber-bright: #ffbb33;
      --outbound-neon: #00ffaa;
      --outbound-neon-bright: #55ffcc;
      --timeline-yellow: #fcee0a;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      border-radius: 0px !important; /* Strictly sharp 90-degree corners everywhere */
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #000000;
      color: #f8fafc;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      letter-spacing: 0.03em;
      touch-action: none;
    }

    .font-mono-code {
      font-family: 'Share Tech Mono', monospace;
    }

    .font-display {
      font-family: 'Orbitron', sans-serif;
    }

    /* Neon Emissive Cyberpunk Orange Flaming Title Text */
    .cyber-flame-title {
      color: #fff7e6;
      white-space: nowrap;
      font-size: clamp(2.1rem, 5.4vw, 4.75rem);
      line-height: 1.05;
      text-shadow:
        0 0 6px #ffffff,
        0 0 14px #ffbb33,
        0 0 28px #ff7700,
        0 0 48px #ff4500,
        0 -8px 65px #ff2200,
        0 -16px 95px rgba(255, 40, 0, 0.85),
        0 4px 12px rgba(0, 0, 0, 0.95);
      animation: neonFlamePulse 1.8s infinite alternate ease-in-out;
    }

    @keyframes neonFlamePulse {
      0% {
        text-shadow:
          0 0 6px #ffffff,
          0 0 12px #ffbb33,
          0 0 26px #ff7700,
          0 0 44px #ff4500,
          0 -6px 60px #ff2200,
          0 -14px 85px rgba(255, 30, 0, 0.8),
          0 4px 14px rgba(0, 0, 0, 0.98);
        filter: brightness(1);
      }
      50% {
        text-shadow:
          0 0 8px #ffffff,
          0 0 18px #ffee55,
          0 0 34px #ff8800,
          0 0 58px #ff3300,
          0 -12px 75px #ff1100,
          0 -22px 110px rgba(255, 60, 0, 0.95),
          0 4px 14px rgba(0, 0, 0, 0.98);
        filter: brightness(1.09);
      }
      100% {
        text-shadow:
          0 0 5px #fff5cc,
          0 0 15px #ffaa22,
          0 0 30px #ff6600,
          0 0 52px #ff2a00,
          0 -10px 70px #ff0000,
          0 -18px 95px rgba(255, 50, 0, 0.9),
          0 4px 14px rgba(0, 0, 0, 0.98);
        filter: brightness(1.04);
      }
    }

    /* 3D Perspective Stage for Initial Search Z-Axis Sink & Zoom Transition */
    #perspective-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      perspective: 1400px;
      perspective-origin: 50% 50%;
      overflow: hidden;
      background-color: #000000;
    }

    /* Background Canvas for Static Square Brick-Wall of Tokens & Memecoins */
    #blockchain-bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      transition: opacity 1.15s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 1.25s cubic-bezier(0.55, 0.05, 0.67, 0.19);
      transform-style: preserve-3d;
    }

    /* Landing View Container (No black rectangle behind title!) */
    #landing-view {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.55, 0.06, 0.68, 0.19),
                  opacity 1.05s cubic-bezier(0.4, 0, 0.2, 1),
                  filter 1.05s ease;
      will-change: transform, opacity;
    }

    /* Sinking & Zooming out along Z-axis to pure black on initial search */
    #landing-view.sink-away {
      transform: translate3d(0, 260px, -1900px) rotateX(18deg) scale(0.14);
      opacity: 0;
      filter: blur(6px);
      pointer-events: none;
    }

    #blockchain-bg-canvas.sink-away {
      opacity: 0;
      pointer-events: none;
    }

    /* Graph View Container */
    #graph-view {
      position: absolute;
      inset: 0;
      z-index: 5;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, -40px, -1300px) scale(0.22);
      transform-style: preserve-3d;
      transition: transform 1.05s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.85s ease-out;
      will-change: transform, opacity;
    }

    #graph-view.zoom-in-active {
      opacity: 1;
      pointer-events: auto;
      transform: translate3d(0, 0, 0) scale(1);
      z-index: 20;
    }

    /* Interactive Pan & Zoom Viewport */
    #flowchart-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 110, 0, 0.04) 0%, rgba(0, 0, 0, 0) 65%),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 64px 64px, 64px 64px;
    }

    #flowchart-viewport:active {
      cursor: grabbing;
    }

    /* World Layer centered at viewport center (50%, 50%) */
    #world-layer {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    #world-layer.smooth-camera-transition {
      transition: transform 0.58s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Compact Futuristic Sharp-Cornered Nodes */
    .cyber-node {
      position: absolute;
      transform: translate(-50%, -50%);
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.2s ease,
                  border-color 0.2s ease,
                  background-color 0.2s ease,
                  transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }

    .node-inbound {
      width: 176px;
      background-color: #070004;
      border: 2px solid var(--inbound-neon);
      color: var(--inbound-neon-bright);
      box-shadow: 0 0 14px rgba(255, 0, 85, 0.32), inset 0 0 12px rgba(255, 0, 85, 0.12);
      cursor: pointer;
      z-index: 20;
    }

    .node-inbound:hover,
    .node-inbound.timeline-highlighted {
      transform: translate(-50%, -50%) scale(1.08);
      border-color: #ff88aa;
      background-color: #19000b;
      box-shadow: 0 0 28px rgba(255, 0, 85, 0.85), 0 0 8px #fcee0a, inset 0 0 16px rgba(255, 0, 85, 0.28);
      z-index: 45;
    }

    /* 1.5x Larger Center Focal Node with Exact 16:10 Aspect Ratio (352px x 220px) */
    .node-center {
      width: 352px;
      height: 220px;
      aspect-ratio: 16 / 10;
      background-color: #090400;
      border: 2.5px solid var(--center-cyber);
      color: var(--center-cyber-bright);
      box-shadow: 0 0 30px rgba(255, 153, 0, 0.46), inset 0 0 22px rgba(255, 153, 0, 0.16);
      z-index: 30;
    }

    .node-center:hover,
    .node-center.timeline-highlighted {
      transform: translate(-50%, -50%) scale(1.04);
      border-color: #ffee55;
      box-shadow: 0 0 38px rgba(255, 153, 0, 0.85), inset 0 0 24px rgba(255, 153, 0, 0.25);
      z-index: 45;
    }

    .node-outbound {
      width: 176px;
      background-color: #000805;
      border: 2px solid var(--outbound-neon);
      color: var(--outbound-neon-bright);
      box-shadow: 0 0 14px rgba(0, 255, 170, 0.32), inset 0 0 12px rgba(0, 255, 170, 0.12);
      cursor: pointer;
      z-index: 20;
    }

    .node-outbound:hover,
    .node-outbound.timeline-highlighted {
      transform: translate(-50%, -50%) scale(1.08);
      border-color: #99ffee;
      background-color: #001810;
      box-shadow: 0 0 28px rgba(0, 255, 170, 0.85), 0 0 8px #fcee0a, inset 0 0 16px rgba(0, 255, 170, 0.28);
      z-index: 45;
    }

    /* Selected Node Morphing to Center Focal State during Transition */
    .node-sliding-to-center {
      width: 290px !important;
      border-color: #ff9900 !important;
      background-color: #0c0500 !important;
      box-shadow: 0 0 42px rgba(255, 153, 0, 0.95), 0 0 14px #fcee0a !important;
      z-index: 60 !important;
      pointer-events: none !important;
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.3s ease,
                  background-color 0.3s ease,
                  box-shadow 0.3s ease !important;
    }

    /* Fade-out class for unselected nodes and connectors */
    .fade-out-element {
      opacity: 0 !important;
      pointer-events: none !important;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Solid Orthogonal 90-Degree SVG Connector Lines */
    .connector-path-inbound {
      fill: none;
      stroke: #ff5500;
      stroke-width: 2.3;
      stroke-linecap: square;
      stroke-linejoin: miter;
      stroke-miterlimit: 10;
      transition: stroke-width 0.18s ease, filter 0.18s ease, stroke 0.18s ease, opacity 0.42s ease;
    }

    .connector-path-outbound {
      fill: none;
      stroke: #00ffaa;
      stroke-width: 2.3;
      stroke-linecap: square;
      stroke-linejoin: miter;
      stroke-miterlimit: 10;
      transition: stroke-width 0.18s ease, filter 0.18s ease, stroke 0.18s ease, opacity 0.42s ease;
    }

    .connector-chevron-inbound {
      fill: none;
      stroke: #ff5500;
      stroke-width: 2.6;
      stroke-linecap: square;
      stroke-linejoin: miter;
      transition: opacity 0.42s ease;
    }

    .connector-chevron-outbound {
      fill: none;
      stroke: #00ffaa;
      stroke-width: 2.6;
      stroke-linecap: square;
      stroke-linejoin: miter;
      transition: opacity 0.42s ease;
    }

    .connector-active-inbound {
      stroke: #ff0055 !important;
      stroke-width: 3.8 !important;
      filter: drop-shadow(0 0 9px rgba(255, 0, 85, 0.98));
    }

    .connector-active-outbound {
      stroke: #55ffcc !important;
      stroke-width: 3.8 !important;
      filter: drop-shadow(0 0 9px rgba(0, 255, 170, 0.98));
    }

    @keyframes dashFlow {
      to {
        stroke-dashoffset: -36;
      }
    }

    .flow-Overlay-anim {
      stroke-dasharray: 6 12;
      animation: dashFlow 0.75s linear infinite;
    }

    /* Soft Yellow See-Through Timeline Viewport Indicator Square/Box */
    #timeline-viewport-box {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 32px;
      background-color: rgba(252, 238, 10, 0.18);
      border: 1.5px solid rgba(252, 238, 10, 0.88);
      box-shadow: 0 0 14px rgba(252, 238, 10, 0.28), inset 0 0 8px rgba(252, 238, 10, 0.15);
      cursor: grab;
      z-index: 15;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    #timeline-viewport-box:hover {
      background-color: rgba(252, 238, 10, 0.25);
      border-color: #ffffff;
    }

    #timeline-viewport-box:active {
      cursor: grabbing;
      background-color: rgba(252, 238, 10, 0.32);
    }

    /* Side Overflow Lists for Off-Screen / Out-of-FOV Transactions */
    .side-overflow-panel {
      position: absolute;
      top: 12px;
      bottom: 62px;
      width: 208px;
      z-index: 38;
      display: flex;
      flex-direction: column;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .side-overflow-panel.panel-hidden {
      opacity: 0;
      pointer-events: none !important;
    }

    #left-overflow-panel {
      left: 10px;
    }

    #right-overflow-panel {
      right: 10px;
    }

    .side-overflow-list {
      overflow-y: auto;
      pointer-events: auto;
      max-height: 100%;
      padding-right: 2px;
    }

    .overflow-item-inbound {
      background-color: rgba(8, 0, 4, 0.9);
      border-left: 3px solid var(--inbound-neon);
      border-top: 1px solid rgba(255, 0, 85, 0.35);
      border-right: 1px solid rgba(255, 0, 85, 0.35);
      border-bottom: 1px solid rgba(255, 0, 85, 0.35);
      color: var(--inbound-neon-bright);
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.2);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .overflow-item-inbound:hover,
    .overflow-item-inbound.active-fov-hover {
      background-color: rgba(28, 0, 14, 0.96);
      border-color: #ff88aa;
      box-shadow: 0 0 18px rgba(255, 0, 85, 0.65);
      transform: translateX(3px);
    }

    .overflow-item-outbound {
      background-color: rgba(0, 9, 6, 0.9);
      border-right: 3px solid var(--outbound-neon);
      border-top: 1px solid rgba(0, 255, 170, 0.35);
      border-left: 1px solid rgba(0, 255, 170, 0.35);
      border-bottom: 1px solid rgba(0, 255, 170, 0.35);
      color: var(--outbound-neon-bright);
      box-shadow: 0 0 12px rgba(0, 255, 170, 0.2);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .overflow-item-outbound:hover,
    .overflow-item-outbound.active-fov-hover {
      background-color: rgba(0, 26, 18, 0.96);
      border-color: #99ffee;
      box-shadow: 0 0 18px rgba(0, 255, 170, 0.65);
      transform: translateX(-3px);
    }

    /* Day Cluster Nodes (Shown when zoomed out / LOD Day Grouping active) */
    .node-day-cluster-inbound {
      width: 204px;
      background: linear-gradient(180deg, #160009 0%, #080004 100%);
      border: 2px solid var(--inbound-neon);
      outline: 1px dashed rgba(255, 51, 119, 0.55);
      outline-offset: 3px;
      color: var(--inbound-neon-bright);
      box-shadow: 0 0 22px rgba(255, 0, 85, 0.45), inset 0 0 14px rgba(255, 0, 85, 0.2);
      cursor: pointer;
      z-index: 26;
    }

    .node-day-cluster-inbound:hover,
    .node-day-cluster-inbound.timeline-highlighted {
      transform: translate(-50%, -50%) scale(1.08);
      border-color: #fcee0a;
      background: #22000e;
      box-shadow: 0 0 32px rgba(255, 0, 85, 0.95), 0 0 12px #fcee0a;
      z-index: 48;
    }

    .node-day-cluster-outbound {
      width: 204px;
      background: linear-gradient(180deg, #00170f 0%, #000805 100%);
      border: 2px solid var(--outbound-neon);
      outline: 1px dashed rgba(0, 255, 170, 0.55);
      outline-offset: 3px;
      color: var(--outbound-neon-bright);
      box-shadow: 0 0 22px rgba(0, 255, 170, 0.45), inset 0 0 14px rgba(0, 255, 170, 0.2);
      cursor: pointer;
      z-index: 26;
    }

    .node-day-cluster-outbound:hover,
    .node-day-cluster-outbound.timeline-highlighted {
      transform: translate(-50%, -50%) scale(1.08);
      border-color: #fcee0a;
      background: #002418;
      box-shadow: 0 0 32px rgba(0, 255, 170, 0.95), 0 0 12px #fcee0a;
      z-index: 48;
    }

    /* Range Input Styling for Top-Left Audio Control */
    input[type="range"].cyber-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #27272a;
      outline: none;
    }
    input[type="range"].cyber-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 14px;
      background: #ff9900;
      cursor: pointer;
      border: 1px solid #ffffff;
      box-shadow: 0 0 8px rgba(255, 153, 0, 0.9);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
    }

    /* ==========================================================================
       MOBILE-ONLY EXPERIENCE OPTIMIZATIONS (< 768px) — DESKTOP REMAINS UNTOUCHED
       ========================================================================== */
    @media (max-width: 767px) {
      /* 1. Compact Top-Left Audio Pill so it never collides with Graph Header */
      #audio-hud {
        top: 6px !important;
        left: 6px !important;
        padding: 4px 8px !important;
        gap: 4px !important;
      }
      #audio-hud .audio-slider-group,
      #audio-hud .audio-divider,
      #audio-status-label {
        display: none !important;
      }

      /* 2. Fit "THA BLOCK IS HOT" cleanly on a single line inside Mobile Screens */
      .cyber-flame-title {
        font-size: clamp(1.35rem, 6.6vw, 2.05rem) !important;
        letter-spacing: 0.06em !important;
      }
      #landing-view {
        padding: 0.85rem !important;
      }
      #flame-title-canvas {
        width: 104% !important;
        height: 135px !important;
      }

      /* 3. Clean Single-Row Mobile Graph Top Bar (No overlap with Audio Pill) */
      #graph-top-header {
        padding-left: 52px !important;
        padding-right: 8px !important;
        padding-top: 6px !important;
        padding-bottom: 6px !important;
        flex-wrap: nowrap !important;
        justify-content: space-between !important;
        gap: 6px !important;
      }
      #live-network-badge,
      #lod-mode-toggle {
        display: none !important;
      }
      #wallet-breadcrumbs {
        max-width: 42vw !important;
      }

      /* 4. Hide Side Overflow Lists on Mobile so they don't cover the Graph */
      #left-overflow-panel,
      #right-overflow-panel {
        display: none !important;
      }

      /* 5. Compact Mobile Zoom Controls Bar centered at Bottom of Viewport */
      #zoom-controls-hud {
        left: 8px !important;
        right: 8px !important;
        bottom: 8px !important;
        justify-content: space-between !important;
        padding: 3px 6px !important;
      }

      /* 6. Streamlined Mobile Bottom Timeline Stage */
      #timeline-stage {

  <script>
    /***************************************************************************
     * 0. LIVE BLOCKCHAIN CONFIGURATION & MOBILE VIEWPORT DETECTOR
     ***************************************************************************/
    const VERCEL_BACKEND_URL = "";

    function isMobileViewport() {
      return window.innerWidth < 768;
    }

    /***************************************************************************
     * 1. PERSISTENT UNFILTERED HTML5 BACKGROUND AUDIO ENGINE (ARCHIVE.ORG WAV)
     ***************************************************************************/
    const bgAudio = document.getElementById('bg-audio');
    let isUserMuted = false;
    let currentVolume = 40;

    bgAudio.volume = currentVolume / 100;
    bgAudio.muted = false;

    const toggleApiDrawerBtn = document.getElementById('toggle-api-drawer-btn');
    const apiKeyDrawer = document.getElementById('api-key-drawer');
    const apiDrawerChevron = document.getElementById('api-drawer-chevron');
    const etherscanApiKeyInput = document.getElementById('etherscan-api-key-input');

    try {
      const savedKey = localStorage.getItem('pocketwatch_etherscan_api_key');
      if (savedKey && etherscanApiKeyInput) {
        etherscanApiKeyInput.value = savedKey;
      }
    } catch (e) {}

    if (toggleApiDrawerBtn && apiKeyDrawer) {
      toggleApiDrawerBtn.addEventListener('click', () => {
        const isHidden = apiKeyDrawer.classList.contains('hidden');
        if (isHidden) {
          apiKeyDrawer.classList.remove('hidden');
          apiDrawerChevron.textContent = '▲';
        } else {
          apiKeyDrawer.classList.add('hidden');
          apiDrawerChevron.textContent = '▼';
        }
      });
    }

    if (etherscanApiKeyInput) {
      etherscanApiKeyInput.addEventListener('input', (e) => {
        try {
          localStorage.setItem('pocketwatch_etherscan_api_key', e.target.value.trim());
        } catch (err) {}
      });
    }

    function attemptPlayUnfilteredAudio() {
      if (isUserMuted) return;
      bgAudio.muted = false;
      bgAudio.volume = currentVolume / 100;
      const playPromise = bgAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {});
      }
    }

    attemptPlayUnfilteredAudio();
    window.addEventListener('DOMContentLoaded', attemptPlayUnfilteredAudio);
    window.addEventListener('load', attemptPlayUnfilteredAudio);

    function unlockAudioOnFirstGesture() {
      if (!isUserMuted && bgAudio.paused) {
        bgAudio.muted = false;
        bgAudio.volume = currentVolume / 100;
        bgAudio.play().catch(() => {});
      }
    }

    ['pointerdown', 'keydown', 'touchstart'].forEach(evtName => {
      window.addEventListener(evtName, unlockAudioOnFirstGesture, { passive: true });
    });

    const audioMuteBtn = document.getElementById('audio-mute-btn');
    const audioIcon = document.getElementById('audio-icon');
    const audioStatusLabel = document.getElementById('audio-status-label');
    const audioVolumeSlider = document.getElementById('audio-volume-slider');
    const audioVolumeValue = document.getElementById('audio-volume-value');

    function updateAudioHudUI() {
      if (isUserMuted || currentVolume === 0) {
        audioIcon.textContent = '[🔇]';

    const flameCanvas = document.getElementById('flame-title-canvas');

    const flameParticles = [];

    function initFlameParticles() {
      flameParticles.length = 0;
      const count = isMobileViewport() ? 75 : 135;
      for (let i = 0; i < count; i++) {
        flameParticles.push(createFlameParticle(true));
      }
    }

    function createFlameParticle(randomY = false) {
      const w = flameCanvas.width;
      const h = flameCanvas.height;
      return {
        x: w * 0.05 + Math.random() * (w * 0.90),
        y: randomY ? (h * 0.35 + Math.random() * (h * 0.45)) : (h * 0.68 + (Math.random() - 0.5) * 16),
        vx: (Math.random() - 0.5) * 0.9,
        vy: -(1.1 + Math.random() * 2.4),
        size: 11 + Math.random() * 24,
        life: randomY ? Math.random() : 0,
        maxLife: 0.65 + Math.random() * 0.55,
        hue: 12 + Math.random() * 34
      };
    }

    function animateTitleFlames() {
      flameCtx.clearRect(0, 0, flameCanvas.width, flameCanvas.height);
      flameCtx.globalCompositeOperation = 'lighter';

      for (let i = 0; i < flameParticles.length; i++) {
        const p = flameParticles[i];
        p.life += 0.018;
        p.x += p.vx + Math.sin(p.life * 8 + i) * 0.45;
        p.y += p.vy;

        const progress = p.life / p.maxLife;
        if (progress >= 1) {
          flameParticles[i] = createFlameParticle(false);
          continue;
        }

        const radius = Math.max(1, p.size * (1 - progress * 0.72));
        const alpha = (1 - progress) * 0.52;

        const grad = flameCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius);
        grad.addColorStop(0, `hsla(${p.hue + 18}, 100%, 72%, ${alpha})`);
        grad.addColorStop(0.45, `hsla(${p.hue}, 100%, 54%, ${alpha * 0.75})`);
        grad.addColorStop(1, `hsla(8, 100%, 40%, 0)`);

        flameCtx.fillStyle = grad;
        flameCtx.beginPath();
        flameCtx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        flameCtx.fill();
      }

      requestAnimationFrame(animateTitleFlames);
    }

    function drawTokenVectorEmblem(ctx, cx, cy, r, token) {
      ctx.save();
      ctx.strokeStyle = token.color;
      ctx.fillStyle = token.color;
      ctx.lineWidth = 1.6;

      ctx.globalAlpha = 0.22;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 1.05, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 1.05, 0, Math.PI * 2);
      ctx.stroke();

      switch (token.type) {
        case 'diamond':
          ctx.beginPath();
          ctx.moveTo(cx, cy - r * 0.78);
          ctx.lineTo(cx + r * 0.52, cy);
          ctx.lineTo(cx, cy + r * 0.78);
          ctx.lineTo(cx - r * 0.52, cy);
          ctx.closePath();
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx - r * 0.52, cy);
          ctx.lineTo(cx + r * 0.52, cy);
          ctx.moveTo(cx, cy - r * 0.78);
          ctx.lineTo(cx, cy + r * 0.78);
          ctx.stroke();
          break;

        case 'frog':
          ctx.beginPath();
          ctx.arc(cx - r * 0.32, cy - r * 0.25, r * 0.26, 0, Math.PI * 2);
          ctx.arc(cx + r * 0.32, cy - r * 0.25, r * 0.26, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillRect(cx - r * 0.36, cy - r * 0.29, 3, 3);
          ctx.fillRect(cx + r * 0.28, cy - r * 0.29, 3, 3);
          ctx.beginPath();
          ctx.strokeStyle = '#ef4444';
          ctx.moveTo(cx - r * 0.52, cy + r * 0.25);
          ctx.lineTo(cx + r * 0.52, cy + r * 0.25);
          ctx.stroke();
          break;

        case 'shiba':
        case 'fox':
          ctx.beginPath();
          ctx.moveTo(cx - r * 0.55, cy + r * 0.45);
          ctx.lineTo(cx - r * 0.55, cy - r * 0.6);
          ctx.lineTo(cx - r * 0.15, cy - r * 0.25);
          ctx.lineTo(cx + r * 0.15, cy - r * 0.25);
          ctx.lineTo(cx + r * 0.55, cy - r * 0.6);
          ctx.lineTo(cx + r * 0.55, cy + r * 0.45);
          ctx.lineTo(cx, cy + r * 0.65);
          ctx.closePath();
          ctx.stroke();
          ctx.fillRect(cx - r * 0.28, cy - r * 0.05, 3, 3);
          ctx.fillRect(cx + r * 0.2, cy - r * 0.05, 3, 3);
          break;

        case 'glasses':
          ctx.fillRect(cx - r * 0.65, cy - r * 0.22, r * 1.3, r * 0.36);
          ctx.clearRect(cx - r * 0.1, cy - r * 0.05, r * 0.2, r * 0.2);
          break;

        case 'viking':
          ctx.beginPath();
          ctx.arc(cx, cy + r * 0.15, r * 0.42, Math.PI, 0);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx - r * 0.4, cy - r * 0.05);
          ctx.lineTo(cx - r * 0.72, cy - r * 0.55);
          ctx.moveTo(cx + r * 0.4, cy - r * 0.05);
          ctx.lineTo(cx + r * 0.72, cy - r * 0.55);
          ctx.stroke();
          break;

        case 'catO':
          ctx.beginPath();
          ctx.arc(cx, cy + r * 0.12, r * 0.38, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx - r * 0.45, cy - r * 0.2);
          ctx.lineTo(cx - r * 0.55, cy - r * 0.62);
          ctx.lineTo(cx - r * 0.15, cy - r * 0.38);
          ctx.moveTo(cx + r * 0.45, cy - r * 0.2);
          ctx.lineTo(cx + r * 0.55, cy - r * 0.62);
          ctx.lineTo(cx + r * 0.15, cy - r * 0.38);
          ctx.stroke();
          break;

        case 'hex':
        case 'slashHex':
          ctx.beginPath();
          for (let s = 0; s < 6; s++) {
            const ang = (Math.PI / 3) * s - Math.PI / 6;
            const hx = cx + r * 0.62 * Math.cos(ang);
            const hy = cy + r * 0.62 * Math.sin(ang);
            if (s === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.closePath();
          ctx.stroke();
          break;

        case 'tophat':
          ctx.fillRect(cx - r * 0.38, cy - r * 0.55, r * 0.76, r * 0.75);
          ctx.fillRect(cx - r * 0.65, cy + r * 0.2, r * 1.3, r * 0.18);
          break;

        default:
          ctx.font = `700 ${Math.floor(r * 0.82)}px "Orbitron", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(token.symbol.slice(0, 3), cx, cy + 1);
          break;
      }

      ctx.restore();
    }

    let wallBricks = [];

    function buildWallBricksData() {
      canvasWidth = window.innerWidth;
      canvasHeight = window.innerHeight;
      bgCanvas.width = canvasWidth;
      bgCanvas.height = canvasHeight;

      const brickSize = isMobileViewport() ? 76 : 96;
      const mortarGap = 4;
      const step = brickSize + mortarGap;
      const rows = Math.ceil(canvasHeight / step) + 2;
      const cols = Math.ceil(canvasWidth / step) + 2;

      let seed = 133742069;
      function nextRand() {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      }

      wallBricks = [];
      for (let row = 0; row < rows; row++) {
        const rowOffset = (row % 2 === 1) ? -Math.floor(step / 2) : 0;
        const y = row * step;

        for (let col = 0; col < cols; col++) {
          const x = col * step + rowOffset;
          const token = TOKEN_WALL_CATALOG[Math.floor(nextRand() * TOKEN_WALL_CATALOG.length)];
          const shortHash = `0x${Math.floor(nextRand() * 0xffff).toString(16).padStart(4, '0')}`;
          const delay = nextRand() * 2250;
          const duration = 620 + nextRand() * 130;
          const spinDir = (nextRand() - 0.5) * 0.38;

          wallBricks.push({
            x,
            y,
            brickSize,
            token,
            shortHash,
            delay,
            duration,
            spinDir
          });
        }
      }
    }

    function drawSingleBrick(ctx, brick, scale = 1, alpha = 1, punchProgress = 0, drawX = brick.x, drawY = brick.y, rotAngle = 0) {
      if (alpha <= 0.01 || scale <= 0.02) return;

      const s = brick.brickSize;
      const cx = drawX + s / 2;
      const cy = drawY + s / 2;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cx, cy);
      if (rotAngle !== 0) {
        ctx.rotate(rotAngle);
      }
      ctx.scale(scale, scale);

      const half = s / 2;

      ctx.fillStyle = '#060609';
      ctx.fillRect(-half, -half, s, s);

      if (punchProgress > 0 && punchProgress < 0.24) {
        const flashIntensity = 1 - (punchProgress / 0.24);
        ctx.strokeStyle = brick.token.color;
        ctx.lineWidth = 1.5 + flashIntensity * 2.2;
        ctx.strokeRect(-half + 0.75, -half + 0.75, s - 1.5, s - 1.5);
      } else {
        ctx.strokeStyle = '#1b1b24';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-half + 0.75, -half + 0.75, s - 1.5, s - 1.5);
      }

      ctx.fillStyle = brick.token.color;
      ctx.globalAlpha = alpha * 0.65;
      ctx.fillRect(-half + 2, -half + 2, 5, 5);
      ctx.globalAlpha = alpha;

      drawTokenVectorEmblem(ctx, 0, -half + s * 0.42, s < 85 ? 16 : 20, brick.token);

      ctx.font = `700 ${s < 85 ? 9 : 10}px "Orbitron", sans-serif`;
      ctx.fillStyle = '#d4d4d8';
      ctx.textAlign = 'center';
      ctx.fillText(`$${brick.token.symbol}`, 0, half - (s < 85 ? 16 : 19));

      ctx.font = '400 8.5px "Share Tech Mono", monospace';
      ctx.fillStyle = '#52525b';
      ctx.fillText(brick.shortHash, 0, half - 6);

      ctx.restore();
    }

    function renderStaticTokenBrickWall() {
      if (brickPunchAnimFrameId) {
        cancelAnimationFrame(brickPunchAnimFrameId);
        brickPunchAnimFrameId = null;
      }
      bgCanvas.classList.remove('sink-away');
      buildWallBricksData();

      bgCtx.fillStyle = '#000000';
      bgCtx.fillRect(0, 0, canvasWidth, canvasHeight);

      for (let i = 0; i < wallBricks.length; i++) {
        drawSingleBrick(bgCtx, wallBricks[i], 1, 1, 0);
      }
    }

    function animateBricksPunchOut(totalDurationMs = 3000) {
      return new Promise((resolve) => {
        if (brickPunchAnimFrameId) {
          cancelAnimationFrame(brickPunchAnimFrameId);
          brickPunchAnimFrameId = null;
        }
        if (!wallBricks.length) {
          buildWallBricksData();
        }

        const startTime = performance.now();
        const vanishCenterX = canvasWidth / 2;
        const vanishCenterY = canvasHeight / 2;

        function renderPunchFrame(now) {
          const elapsed = now - startTime;

          bgCtx.fillStyle = '#000000';
          bgCtx.fillRect(0, 0, canvasWidth, canvasHeight);

          const activePunchingBricks = [];

          for (let i = 0; i < wallBricks.length; i++) {
            const b = wallBricks[i];
            if (elapsed <= b.delay) {
              drawSingleBrick(bgCtx, b, 1, 1, 0);
            } else if (elapsed < b.delay + b.duration) {
              activePunchingBricks.push(b);
            }
          }

          for (let i = 0; i < activePunchingBricks.length; i++) {
            const b = activePunchingBricks[i];
            const t = (elapsed - b.delay) / b.duration;
            const eased = t * t * (3 - 2 * t);

            const zDepth = Math.pow(t, 1.55) * 2800;
            const fovScale = 420 / (420 + zDepth);
            const alpha = Math.max(0, 1 - Math.pow(t, 1.35));

            const brickCenterX = b.x + b.brickSize / 2;
            const brickCenterY = b.y + b.brickSize / 2;
            const pullFactor = eased * 0.42;
            const projX = brickCenterX + (vanishCenterX - brickCenterX) * pullFactor - b.brickSize / 2;
            const projY = brickCenterY + (vanishCenterY - brickCenterY) * pullFactor - b.brickSize / 2;
            const rotAngle = b.spinDir * eased;

            drawSingleBrick(bgCtx, b, fovScale, alpha, t, projX, projY, rotAngle);
          }

          if (elapsed < totalDurationMs) {
            brickPunchAnimFrameId = requestAnimationFrame(renderPunchFrame);
          } else {
            bgCtx.fillStyle = '#000000';
            bgCtx.fillRect(0, 0, canvasWidth, canvasHeight);
            brickPunchAnimFrameId = null;
            resolve();
          }
        }

        brickPunchAnimFrameId = requestAnimationFrame(renderPunchFrame);
      });
    }

      const d = new Date(ms);

    function weiToEthFloat(weiValue) {
      if (!weiValue) return 0;
      try {
        const str = String(weiValue).trim();
        if (str.startsWith('0x') || str.startsWith('0X')) {
          const big = BigInt(str);
          return Number(big) / 1e18;
        }
        const cleanDigits = str.split('.')[0].replace(/[^0-9]/g, '');
        if (!cleanDigits) return 0;
        const big = BigInt(cleanDigits);
        return Number(big) / 1e18;
      } catch (e) {
        return (parseFloat(weiValue) || 0) / 1e18;
      }
    }

    function tokenUnitsToFloat(rawValue, decimals = 18) {
      if (!rawValue) return 0;
      const dec = Math.max(0, Math.min(36, parseInt(decimals, 10) || 18));
      try {
        const str = String(rawValue).trim().split('.')[0].replace(/[^0-9]/g, '');
        if (!str) return 0;
        return parseFloat(str) / Math.pow(10, dec);
      } catch (e) {
        return (parseFloat(rawValue) || 0) / Math.pow(10, dec);
      }
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 8500) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timer);
        return res;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    async function resolveTxHashToWalletAddress(txHash) {
      try {
        const res = await fetchWithTimeout(`https://eth.blockscout.com/api/v2/transactions/${encodeURIComponent(txHash)}`);
        if (res.ok) {
          const txData = await res.json();
          const fromAddr = txData?.from?.hash;
          const toAddr = txData?.to?.hash;
          const tsMs = txData?.timestamp ? new Date(txData.timestamp).getTime() : null;
          if (fromAddr) {
            return {
              resolvedAddress: fromAddr,
              referenceTimestampMs: tsMs,
              clickedDirection: 'outbound',
              counterpartyAddress: toAddr
            };
          }
        }
      } catch (e) {}

      try {
        const rpcRes = await fetchWithTimeout('https://ethereum-rpc.publicnode.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jsonrpc: '2.0',
            method: 'eth_getTransactionByHash',
            params: [txHash],
            id: 1
          })
        });
        if (rpcRes.ok) {
          const rpcData = await rpcRes.json();
          const fromAddr = rpcData?.result?.from;
          if (fromAddr) {
            return {
              resolvedAddress: fromAddr,
              referenceTimestampMs: null,
              clickedDirection: 'outbound'
            };
          }
        }
      } catch (e) {}

      return null;
    }

    const MAX_SIDE_NODES = 60;
    const MOBILE_MAX_SIDE_NODES = 5;
    let WORLD_TIMELINE_HALF_SPAN_X = 2400;
    const CLOSEST_SIX_WORLD_HALF_SPAN_X = 820;
    const DAY_GROUP_ZOOM_THRESHOLD = 0.58;

    let lodGroupingMode = 'auto';
    let isCurrentlyDayGrouped = false;

    function shouldUseDayGrouping() {
      if (!currentFocalWalletData) return false;
      if (isMobileViewport()) return false; // Mobile caps nodes to a clean, readable set directly
      const totalConnected = (currentFocalWalletData.inboundNodes?.length || 0) +
                             (currentFocalWalletData.outboundNodes?.length || 0);
      if (lodGroupingMode === 'day') return totalConnected > 0;
      if (lodGroupingMode === 'individual') return false;
      return totalConnected > 12 && camZoom < DAY_GROUP_ZOOM_THRESHOLD;
    }

      const dot = document.getElementById('lod-mode-dot');
      const label = document.getElementById('lod-mode-label');

        dot.className = 'w-1.5 h-1.5 bg-[#fcee0a] inline-block shadow-[0_0_6px_#fcee0a]';

        dot.className = 'w-1.5 h-1.5 bg-[#ff9900] inline-block';
