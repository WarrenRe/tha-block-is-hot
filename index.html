    async function refreshLiveEthPriceFallback() {
      try {
        const res = await fetchWithTimeout('https://api.binance.com/api/v3/ticker/price?symbol=ETHUSDT', {}, 4000);
        if (res.ok) {
          const d = await res.json();
          const p = parseFloat(d?.price);
          if (p > 100) {
            liveEthUsdPrice = p;
            return;
          }
        }
      } catch (e) {}
      try {
        const res = await fetchWithTimeout('https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd', {}, 4000);
        if (res.ok) {
          const d = await res.json();
          const p = parseFloat(d?.ethereum?.usd);
          if (p > 100) liveEthUsdPrice = p;
        }
      } catch (e) {}
    }

    async function fetchMultiPageBlockscoutV2Txs(address, maxPages = 3) {
      const items = [];
      let nextParams = '';
      for (let page = 0; page < maxPages; page++) {
        const url = `https://eth.blockscout.com/api/v2/addresses/${encodeURIComponent(address)}/transactions${nextParams ? `?${nextParams}` : ''}`;
        try {
          const res = await fetchWithTimeout(url, {}, 7500);
          if (!res.ok) break;
          const json = await res.json();
          if (Array.isArray(json?.items)) {
            items.push(...json.items);
          }
          if (json?.next_page_params && items.length < 180) {
            const qp = new URLSearchParams();
            Object.entries(json.next_page_params).forEach(([k, v]) => {
              if (v !== null && v !== undefined) qp.set(k, String(v));
            });
            nextParams = qp.toString();
          } else {
            break;
          }
        } catch (err) {
          break;
        }
      }
      return items;
    }

    function buildDayClustersForSide(nodes, sideType, dynamicSpanX) {
      if (!Array.isArray(nodes) || nodes.length === 0) return [];
      const dayMap = new Map();

      nodes.forEach((node) => {
        const dayKey = (node.dateStr || '').slice(0, 10) || 'UNKNOWN-DAY';
        if (!dayMap.has(dayKey)) {
          dayMap.set(dayKey, {
            dayKey,
            type: sideType,
            nodes: [],
            uniqueWallets: new Set(),
            totalAmountUsd: 0,
            totalAmountEth: 0,
            sumWorldX: 0,
            sumTimestampMs: 0,
            tokenTotals: new Map()
          });
        }
        const bucket = dayMap.get(dayKey);
        bucket.nodes.push(node);
        bucket.uniqueWallets.add(node.address.toLowerCase());
        const usdVal = node.amountUsd !== undefined ? node.amountUsd : (node.amountEth * liveEthUsdPrice);
        bucket.totalAmountUsd += usdVal;
        bucket.totalAmountEth += (node.amountEth || 0);
        bucket.sumWorldX += node.worldX;
        bucket.sumTimestampMs += node.timestampMs;

        (node.tokens || []).forEach(t => {
          if (!bucket.tokenTotals.has(t.ticker)) {
            bucket.tokenTotals.set(t.ticker, t.amount);
          }
        });
      });

      const clustersRaw = Array.from(dayMap.values());
      clustersRaw.sort((a, b) => (a.sumTimestampMs / a.nodes.length) - (b.sumTimestampMs / b.nodes.length));

      const clusterYPattern = [-280, 180, -90, 290, 60, -195, 360, -360, 120, -140];

      return clustersRaw.map((bucket, idx) => {
        const sortedByUsd = [...bucket.nodes].sort((a, b) => (b.amountUsd || 0) - (a.amountUsd || 0));
        const topNode = sortedByUsd[0] || bucket.nodes[0];

        const rankFromCenter = sideType === 'inbound'
          ? (clustersRaw.length - 1 - idx)
          : idx;

        const dirSign = sideType === 'inbound' ? -1 : 1;
        const clusterWorldX = dirSign * Math.round(330 + rankFromCenter * 225);
        const clusterWorldY = clusterYPattern[rankFromCenter % clusterYPattern.length];
        const avgTimestampMs = Math.round(bucket.sumTimestampMs / bucket.nodes.length);

        const combinedTokens = Array.from(bucket.tokenTotals.entries())
          .slice(0, 4)
          .map(([ticker, amount]) => ({ ticker, amount }));

        return {
          id: `${sideType}-day-cluster-${idx}`,
          isDayCluster: true,
          dayKey: bucket.dayKey,
          type: sideType,
          txCount: bucket.nodes.length,
          walletCount: bucket.uniqueWallets.size,
          address: topNode.address,
          topNode,
          memberNodes: bucket.nodes,
          amountUsd: bucket.totalAmountUsd,
          amountEth: bucket.totalAmountEth,
          timestampMs: avgTimestampMs,
          dateStr: `${bucket.dayKey} (${bucket.nodes.length} TXs)`,
          tokens: combinedTokens.length > 0 ? combinedTokens : [{ ticker: 'ETH', amount: formatCompactTokenUnits(bucket.totalAmountEth) }],
          worldX: clusterWorldX,
          worldY: clusterWorldY,
          focusWorldX: Math.round(bucket.sumWorldX / bucket.nodes.length),
          focusWorldY: topNode.worldY,
          timelineRatio: sideType === 'inbound'
            ? Math.max(0.02, Math.min(0.48, 0.5 + (clusterWorldX / (dynamicSpanX * 2))))
            : Math.max(0.52, Math.min(0.98, 0.5 + (clusterWorldX / (dynamicSpanX * 2))))
        };
      });
    }

    async function getOrCreateWalletGraph(rawInput, linkContext = null) {
      let cleanInput = (rawInput || '').trim();
      if (!cleanInput.startsWith('0x') && /^[a-fA-F0-9]{40,64}$/.test(cleanInput)) {
        cleanInput = `0x${cleanInput}`;
      }

      setNetworkStatusBadge('QUERYING ETH MAINNET...', true);

      if (/^0x[a-fA-F0-9]{64}$/.test(cleanInput)) {
        const txResolved = await resolveTxHashToWalletAddress(cleanInput);
        if (txResolved && txResolved.resolvedAddress) {
          cleanInput = txResolved.resolvedAddress;
          if (!linkContext && txResolved.referenceTimestampMs) {
            linkContext = {
              clickedDirection: txResolved.clickedDirection || 'outbound',
              referenceTimestampMs: txResolved.referenceTimestampMs
            };
          }
          showToast(`TX RESOLVED TO WALLET ${formatShortHash(cleanInput)}`);
        }
      }

      const normalizedAddress = cleanInput;
      const cacheKey = `${normalizedAddress.toLowerCase()}_${isMobileViewport() ? 'm' : 'd'}`;

      if (walletGraphCache.has(cacheKey) && !linkContext) {
        setNetworkStatusBadge('ETH MAINNET // LIVE', true);
        return walletGraphCache.get(cacheKey);
      }

      const nowMs = Date.now();
      const maxAllowedTxMs = nowMs - 1000;

      const userEtherscanApiKey = (document.getElementById('etherscan-api-key-input')?.value || '').trim();

      const vercelPromise = (VERCEL_BACKEND_URL && VERCEL_BACKEND_URL.trim().length > 0)
        ? fetchWithTimeout(`${VERCEL_BACKEND_URL.trim()}?wallet=${encodeURIComponent(normalizedAddress)}&address=${encodeURIComponent(normalizedAddress)}`)
            .then(r => r.ok ? r.json() : null)
            .catch(() => null)
        : Promise.resolve(null);

      const addressInfoPromise = fetchWithTimeout(`https://eth.blockscout.com/api/v2/addresses/${encodeURIComponent(normalizedAddress)}`)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null);

      const tokenHoldingsPromise = fetchWithTimeout(`https://eth.blockscout.com/api/v2/addresses/${encodeURIComponent(normalizedAddress)}/tokens?type=ERC-20`)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null);

      const v2MultiPageTxPromise = fetchMultiPageBlockscoutV2Txs(normalizedAddress, isMobileViewport() ? 1 : 3);

      const normalTxUrl = userEtherscanApiKey
        ? `https://api.etherscan.io/v2/api?chainid=1&module=account&action=txlist&address=${encodeURIComponent(normalizedAddress)}&startblock=0&endblock=99999999&page=1&offset=200&sort=desc&apikey=${encodeURIComponent(userEtherscanApiKey)}`
        : `https://eth.blockscout.com/api?module=account&action=txlist&address=${encodeURIComponent(normalizedAddress)}&sort=desc&page=1&offset=200`;

      const tokenTxUrl = userEtherscanApiKey
        ? `https://api.etherscan.io/v2/api?chainid=1&module=account&action=tokentx&address=${encodeURIComponent(normalizedAddress)}&startblock=0&endblock=99999999&page=1&offset=200&sort=desc&apikey=${encodeURIComponent(userEtherscanApiKey)}`
        : `https://eth.blockscout.com/api?module=account&action=tokentx&address=${encodeURIComponent(normalizedAddress)}&sort=desc&page=1&offset=200`;

      const normalTxPromise = fetchWithTimeout(normalTxUrl, {}, 9000)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null);

      const tokenTxPromise = fetchWithTimeout(tokenTxUrl, {}, 9000)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null);

      const [vercelData, addressInfo, tokenHoldingsData, v2TxItems, normalTxData, tokenTxData] = await Promise.all([
        vercelPromise,
        addressInfoPromise,
        tokenHoldingsPromise,
        v2MultiPageTxPromise,
        normalTxPromise,
        tokenTxPromise
      ]);

      if (addressInfo && addressInfo.exchange_rate) {
        const parsedRate = parseFloat(addressInfo.exchange_rate);
        if (parsedRate > 100) {
          liveEthUsdPrice = parsedRate;
        }
      } else {
        await refreshLiveEthPriceFallback();
      }

      let nativeEthBalance = 0;
      if (vercelData && vercelData.balance !== undefined && vercelData.balance !== null) {
        nativeEthBalance = weiToEthFloat(vercelData.balance);
      } else if (addressInfo && addressInfo.coin_balance !== undefined && addressInfo.coin_balance !== null) {
        nativeEthBalance = weiToEthFloat(addressInfo.coin_balance);
      } else {
        try {
          const rpcRes = await fetchWithTimeout('https://ethereum-rpc.publicnode.com', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              jsonrpc: '2.0',
              method: 'eth_getBalance',
              params: [normalizedAddress, 'latest'],
              id: 1
            })
          });
          if (rpcRes.ok) {
            const rpcJson = await rpcRes.json();
            if (rpcJson?.result) {
              nativeEthBalance = weiToEthFloat(rpcJson.result);
            }
          }
        } catch (e) {}
      }

      const nativeEthUsd = nativeEthBalance * liveEthUsdPrice;

      const tokenPriceLookup = new Map();
      tokenPriceLookup.set('ETH', liveEthUsdPrice);

      let totalErc20Usd = 0;
      const parsedHoldings = [];

      if (nativeEthBalance > 0) {
        parsedHoldings.push({
          ticker: 'ETH',
          amount: formatCompactTokenUnits(nativeEthBalance),
          usdValue: nativeEthUsd
        });
      }

      const rawTokenItems = Array.isArray(tokenHoldingsData?.items) ? tokenHoldingsData.items : [];
      for (const item of rawTokenItems) {
        const tokenMeta = item.token || {};
        const rawSymbol = String(tokenMeta.symbol || '').trim().toUpperCase();
        if (!rawSymbol || rawSymbol.length > 12) continue;

        const decimals = parseInt(tokenMeta.decimals ?? '18', 10);
        const units = tokenUnitsToFloat(item.value, decimals);
        if (units <= 0) continue;

        let unitPriceUsd = parseFloat(tokenMeta.exchange_rate || '0');
        if ((!unitPriceUsd || unitPriceUsd <= 0) && STABLECOIN_SYMBOLS.has(rawSymbol)) {
          unitPriceUsd = 1.0;
        } else if ((!unitPriceUsd || unitPriceUsd <= 0) && KNOWN_TOKEN_FALLBACK_USD[rawSymbol]) {
          unitPriceUsd = KNOWN_TOKEN_FALLBACK_USD[rawSymbol]();
        }

        if (unitPriceUsd > 0) {
          tokenPriceLookup.set(rawSymbol, unitPriceUsd);
        }

        const holdingUsd = unitPriceUsd > 0 ? (units * unitPriceUsd) : 0;
        totalErc20Usd += holdingUsd;

        parsedHoldings.push({
          ticker: rawSymbol,
          amount: formatCompactTokenUnits(units),
          usdValue: holdingUsd
        });
      }

      parsedHoldings.sort((a, b) => b.usdValue - a.usdValue);
      const topWalletTokens = parsedHoldings.slice(0, 6);
      if (topWalletTokens.length === 0) {
        topWalletTokens.push({ ticker: 'ETH', amount: '0.00', usdValue: 0 });
      }

      const totalPortfolioUsd = nativeEthUsd + totalErc20Usd;

      const normalTxList = Array.isArray(normalTxData?.result) ? normalTxData.result : [];
      const tokenTxList = Array.isArray(tokenTxData?.result) ? tokenTxData.result : [];

      const combinedEvents = [];
      const seenEventKeys = new Set();
      const addrLower = normalizedAddress.toLowerCase();

      for (const tx of tokenTxList) {
        if (!tx || !tx.hash) continue;
        const fromAddr = String(tx.from || '').trim();
        const toAddr = String(tx.to || '').trim();
        if (!fromAddr || !toAddr) continue;

        const symbol = String(tx.tokenSymbol || 'ERC20').trim().toUpperCase().slice(0, 10);
        const decimals = parseInt(tx.tokenDecimal ?? '18', 10);
        const units = tokenUnitsToFloat(tx.value, decimals);
        if (units <= 0) continue;

        let unitPrice = tokenPriceLookup.get(symbol) || 0;
        if (unitPrice <= 0 && STABLECOIN_SYMBOLS.has(symbol)) {
          unitPrice = 1.0;
        } else if (unitPrice <= 0 && KNOWN_TOKEN_FALLBACK_USD[symbol]) {
          unitPrice = KNOWN_TOKEN_FALLBACK_USD[symbol]();
        }

        const amountUsd = unitPrice > 0 ? (units * unitPrice) : 0;
        const rawTs = parseInt(tx.timeStamp || '0', 10) * 1000;
        const tsMs = rawTs > 0 ? Math.min(maxAllowedTxMs, rawTs) : maxAllowedTxMs;

        const isInbound = toAddr.toLowerCase() === addrLower && fromAddr.toLowerCase() !== addrLower;
        const isOutbound = fromAddr.toLowerCase() === addrLower;
        if (!isInbound && !isOutbound) continue;

        const eventKey = `${tx.hash.toLowerCase()}_${isInbound ? 'in' : 'out'}_${symbol}`;
        if (seenEventKeys.has(eventKey)) continue;
        seenEventKeys.add(eventKey);

        combinedEvents.push({
          txHash: tx.hash,
          type: isInbound ? 'inbound' : 'outbound',
          counterparty: isInbound ? fromAddr : toAddr,
          amountUsd,
          amountEth: liveEthUsdPrice > 0 ? (amountUsd / liveEthUsdPrice) : 0,
          timestampMs: tsMs,
          dateStr: formatTimestampUTC(tsMs),
          tokens: [{ ticker: symbol, amount: formatCompactTokenUnits(units) }]
        });
      }

      for (const tx of normalTxList) {
        if (!tx || !tx.hash || tx.isError === '1') continue;
        const fromAddr = String(tx.from || '').trim();
        const toAddr = String(tx.to || tx.contractAddress || '').trim();
        if (!fromAddr || !toAddr) continue;

        const ethVal = weiToEthFloat(tx.value);
        const amountUsd = ethVal * liveEthUsdPrice;
        const rawTs = parseInt(tx.timeStamp || '0', 10) * 1000;
        const tsMs = rawTs > 0 ? Math.min(maxAllowedTxMs, rawTs) : maxAllowedTxMs;

        const isInbound = toAddr.toLowerCase() === addrLower && fromAddr.toLowerCase() !== addrLower;
        const isOutbound = fromAddr.toLowerCase() === addrLower;
        if (!isInbound && !isOutbound) continue;

        const hasTokenTransferForHash = Array.from(seenEventKeys).some(k => k.startsWith(tx.hash.toLowerCase()));
        if (ethVal <= 0 && hasTokenTransferForHash) continue;

        const eventKey = `${tx.hash.toLowerCase()}_${isInbound ? 'in' : 'out'}_ETH`;
        if (seenEventKeys.has(eventKey)) continue;
        seenEventKeys.add(eventKey);

        combinedEvents.push({
          txHash: tx.hash,
          type: isInbound ? 'inbound' : 'outbound',
          counterparty: isInbound ? fromAddr : toAddr,
          amountUsd,
          amountEth: ethVal,
          timestampMs: tsMs,
          dateStr: formatTimestampUTC(tsMs),
          tokens: [{ ticker: 'ETH', amount: formatCompactTokenUnits(ethVal) }]
        });
      }

      if (Array.isArray(v2TxItems)) {
        for (const item of v2TxItems) {
          if (!item || !item.hash || item.status === 'error') continue;
          const fromAddr = String(item.from?.hash || '').trim();
          const toAddr = String(item.to?.hash || item.created_contract?.hash || '').trim();
          if (!fromAddr || !toAddr) continue;

          const isInbound = toAddr.toLowerCase() === addrLower && fromAddr.toLowerCase() !== addrLower;
          const isOutbound = fromAddr.toLowerCase() === addrLower;
          if (!isInbound && !isOutbound) continue;

          const eventKey = `${item.hash.toLowerCase()}_${isInbound ? 'in' : 'out'}_ETH`;
          const alreadyHasHash = Array.from(seenEventKeys).some(k => k.startsWith(item.hash.toLowerCase()));
          if (seenEventKeys.has(eventKey) || alreadyHasHash) continue;
          seenEventKeys.add(eventKey);

          const ethVal = weiToEthFloat(item.value);
          const amountUsd = ethVal * liveEthUsdPrice;
          const parsedMs = item.timestamp ? new Date(item.timestamp).getTime() : maxAllowedTxMs;
          const tsMs = parsedMs > 0 ? Math.min(maxAllowedTxMs, parsedMs) : maxAllowedTxMs;

          combinedEvents.push({
            txHash: item.hash,
            type: isInbound ? 'inbound' : 'outbound',
            counterparty: isInbound ? fromAddr : toAddr,
            amountUsd,
            amountEth: ethVal,
            timestampMs: tsMs,
            dateStr: formatTimestampUTC(tsMs),
            tokens: [{ ticker: 'ETH', amount: formatCompactTokenUnits(ethVal) }]
          });
        }
      }

      combinedEvents.sort((a, b) => b.timestampMs - a.timestampMs);

      const sideLimit = isMobileViewport() ? MOBILE_MAX_SIDE_NODES : MAX_SIDE_NODES;
      const rawInbound = combinedEvents.filter(e => e.type === 'inbound').slice(0, sideLimit);
      const rawOutbound = combinedEvents.filter(e => e.type === 'outbound').slice(0, sideLimit);

      rawInbound.sort((a, b) => a.timestampMs - b.timestampMs);
      rawOutbound.sort((a, b) => a.timestampMs - b.timestampMs);

      const maxSideCount = Math.max(rawInbound.length, rawOutbound.length, 6);
      const dynamicHalfSpanX = isMobileViewport()
        ? 680
        : Math.max(1680, 820 + Math.max(0, maxSideCount - 6) * 105);
      WORLD_TIMELINE_HALF_SPAN_X = dynamicHalfSpanX;

      const closest6InboundY = isMobileViewport()
        ? [-255, 195, -95, 295, 75]
        : [-310, 195, -105, 315, 70, -215];
      const outerInboundYLanes = [-660, 560, -490, 420, -350, 275, -175, 130, -35, 680, -580, 495];
      const closest6OutboundY = isMobileViewport()
        ? [-225, 135, 275, -80, 215]
        : [-250, 125, 295, -90, 215, -330];
      const outerOutboundYLanes = [550, -640, 415, -485, 355, -210, 165, -380, 45, 670, -560, 485];

      const inboundStepX = isMobileViewport() ? 68 : 88;
      const baseNodeX = isMobileViewport() ? 270 : 285;

      const inboundNodes = rawInbound.map((ev, i) => {
        const totalIn = rawInbound.length;
        const distRank = (totalIn - 1) - i;
        const worldX = distRank < 6
          ? -Math.round(baseNodeX + distRank * inboundStepX)
          : -Math.round(825 + (distRank - 6) * 102);
        const worldY = distRank < 6
          ? closest6InboundY[distRank % closest6InboundY.length]
          : outerInboundYLanes[(distRank - 6) % outerInboundYLanes.length];

        return {
          id: `inbound-node-${i}`,
          type: 'inbound',
          txHash: ev.txHash,
          address: ev.counterparty,
          amountUsd: ev.amountUsd,
          amountEth: ev.amountEth,
          timestampMs: ev.timestampMs,
          dateStr: ev.dateStr,
          tokens: ev.tokens,
          worldX,
          worldY,
          distRank,
          isClosestSix: distRank < 6,
          isLinkedPrevious: Boolean(
            linkContext?.previousWallet &&
            ev.counterparty.toLowerCase() === linkContext.previousWallet.address.toLowerCase()
          ),
          timelineRatio: Math.max(0.02, Math.min(0.48, 0.5 + (worldX / (dynamicHalfSpanX * 2))))
        };
      });

      const outboundNodes = rawOutbound.map((ev, i) => {
        const distRank = i;
        const worldX = distRank < 6
          ? Math.round(baseNodeX + distRank * inboundStepX)
          : Math.round(825 + (distRank - 6) * 102);
        const worldY = distRank < 6
          ? closest6OutboundY[distRank % closest6OutboundY.length]
          : outerOutboundYLanes[(distRank - 6) % outerOutboundYLanes.length];

        return {
          id: `outbound-node-${i}`,
          type: 'outbound',
          txHash: ev.txHash,
          address: ev.counterparty,
          amountUsd: ev.amountUsd,
          amountEth: ev.amountEth,
          timestampMs: ev.timestampMs,
          dateStr: ev.dateStr,
          tokens: ev.tokens,
          worldX,
          worldY,
          distRank,
          isClosestSix: distRank < 6,
          isLinkedPrevious: Boolean(
            linkContext?.previousWallet &&
            ev.counterparty.toLowerCase() === linkContext.previousWallet.address.toLowerCase()
          ),
          timelineRatio: Math.max(0.52, Math.min(0.98, 0.5 + (worldX / (dynamicHalfSpanX * 2))))
        };
      });

      const inboundDayClusters = buildDayClustersForSide(inboundNodes, 'inbound', dynamicHalfSpanX);
      const outboundDayClusters = buildDayClustersForSide(outboundNodes, 'outbound', dynamicHalfSpanX);

      const mostRecentEvent = combinedEvents.length > 0 ? combinedEvents[0] : null;
      const centerTimestampMs = linkContext?.referenceTimestampMs
        ? Math.min(maxAllowedTxMs, linkContext.referenceTimestampMs)
        : (mostRecentEvent ? mostRecentEvent.timestampMs : 0);

      const centerDateStr = centerTimestampMs > 0
        ? formatTimestampUTC(centerTimestampMs)
        : 'NO TX HISTORY';

      const lastTxDirection = linkContext?.clickedDirection
        ? linkContext.clickedDirection
        : (mostRecentEvent ? mostRecentEvent.type : 'none');

      const allTimestamps = combinedEvents.map(e => e.timestampMs).filter(t => t > 0);
      const minTimelineMs = allTimestamps.length > 0 ? Math.min(...allTimestamps) : 0;
      const maxTimelineMs = allTimestamps.length > 0 ? Math.max(...allTimestamps) : 0;

      const walletGraph = {
        address: normalizedAddress,
        shortAddress: formatShortHash(normalizedAddress),
        totalPortfolioUsd,
        balanceEth: nativeEthBalance.toFixed(4),
        lastTxTimestampMs: centerTimestampMs,
        lastTxDateStr: centerDateStr,
        lastTxDirection,
        tokens: topWalletTokens,
        inboundNodes,
        outboundNodes,
        inboundDayClusters,
        outboundDayClusters,
        worldHalfSpanX: dynamicHalfSpanX,
        minTimelineMs,
        maxTimelineMs
      };

      setNetworkStatusBadge(
        VERCEL_BACKEND_URL ? 'VERCEL + ETH MAINNET // LIVE' : `ETH MAINNET // ${inboundNodes.length + outboundNodes.length} NODES`,
        true
      );

      walletGraphCache.set(cacheKey, walletGraph);
      return walletGraph;
    }

    /***************************************************************************
     * 6. PAN & ZOOM WORLD VIEWPORT CONTROLLER + TOUCH PINCH-TO-ZOOM FOR MOBILE
     ***************************************************************************/
    const viewportEl = document.getElementById('flowchart-viewport');
    const worldLayerEl = document.getElementById('world-layer');
    const nodesContainerEl = document.getElementById('nodes-container');
    const svgCurvesGroup = document.getElementById('svg-curves-group');
    const svgHoverGuideline = document.getElementById('svg-hover-guideline');
    const timelineTicksLayer = document.getElementById('timeline-ticks-layer');
    const timelineTrackEl = document.getElementById('timeline-track');
    const timelineViewportBoxEl = document.getElementById('timeline-viewport-box');
    const breadcrumbsEl = document.getElementById('wallet-breadcrumbs');
    const zoomReadoutEl = document.getElementById('zoom-level-readout');
    const leftOverflowPanelEl = document.getElementById('left-overflow-panel');
    const leftOverflowListEl = document.getElementById('left-overflow-list');
    const leftOverflowCountEl = document.getElementById('left-overflow-count');
    const rightOverflowPanelEl = document.getElementById('right-overflow-panel');
    const rightOverflowListEl = document.getElementById('right-overflow-list');
    const rightOverflowCountEl = document.getElementById('right-overflow-count');

    const MIN_ZOOM_SCALE = 0.18;
    const MAX_ZOOM_SCALE = 2.75;

    let camPanX = 0;
    let camPanY = 0;
    let camZoom = 1;
    let isDraggingViewport = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragOriginPanX = 0;
    let dragOriginPanY = 0;

    function updateWorldTransform(smooth = false) {
      if (smooth) {
        worldLayerEl.classList.add('smooth-camera-transition');
      } else {
        worldLayerEl.classList.remove('smooth-camera-transition');
      }
      worldLayerEl.style.transform = `translate3d(${camPanX}px, ${camPanY}px, 0) scale(${camZoom})`;
      zoomReadoutEl.textContent = `${Math.round(camZoom * 100)}%`;

      if (currentFocalWalletData && !isAnimatingNodeTransition) {
        const nextGroupedState = shouldUseDayGrouping();
        if (nextGroupedState !== isCurrentlyDayGrouped) {
          isCurrentlyDayGrouped = nextGroupedState;
          renderWalletGraphDOM(currentFocalWalletData, false);
        }
        updateLodBadgeUI();
      }

      syncTimelineViewportAndMarkers();
      drawHoverLaserGuideline();
    }

    function focusCenterNodeZoom(smooth = true) {
      const rect = viewportEl.getBoundingClientRect();
      if (!rect.width || !rect.height) {
        camZoom = isMobileViewport() ? 0.86 : 1.25;
      } else if (isMobileViewport()) {
        const targetZoom = Math.min((rect.width * 0.92) / 365, (rect.height * 0.78) / 260);
        camZoom = Math.max(0.72, Math.min(1.05, targetZoom));
      } else {
        const targetZoom = Math.min(rect.width / 820, rect.height / 500);
        camZoom = Math.max(1.15, Math.min(1.34, targetZoom));
      }
      camPanX = 0;
      camPanY = 0;
      updateWorldTransform(smooth);
    }

    function fitClosestSixToViewport(smooth = true) {
      const rect = viewportEl.getBoundingClientRect();
      if (!rect.width || !rect.height) {
        camZoom = isMobileViewport() ? 0.46 : 0.72;
      } else if (isMobileViewport()) {
        const requiredWidth = 960;
        const requiredHeight = 680;
        const scaleX = (rect.width * 0.95) / requiredWidth;
        const scaleY = (rect.height * 0.85) / requiredHeight;
        camZoom = Math.max(0.36, Math.min(0.68, Math.min(scaleX, scaleY)));
      } else {
        const requiredWidth = CLOSEST_SIX_WORLD_HALF_SPAN_X * 2 + 220;
        const requiredHeight = 780;
        const scaleX = (rect.width * 0.92) / requiredWidth;
        const scaleY = (rect.height * 0.88) / requiredHeight;
        camZoom = Math.max(0.60, Math.min(1.02, Math.min(scaleX, scaleY)));
      }
      camPanX = 0;
      camPanY = 0;
      updateWorldTransform(smooth);
    }

    function fitAllNodesToViewport(smooth = true) {
      const rect = viewportEl.getBoundingClientRect();
      if (!rect.width || !rect.height) return;

      const totalNodes = (currentFocalWalletData?.inboundNodes?.length || 0) +
                         (currentFocalWalletData?.outboundNodes?.length || 0);

      const activeIn = (!isMobileViewport() && totalNodes > 12 && lodGroupingMode !== 'individual')
        ? (currentFocalWalletData?.inboundDayClusters || [])
        : (currentFocalWalletData?.inboundNodes || []);
      const activeOut = (!isMobileViewport() && totalNodes > 12 && lodGroupingMode !== 'individual')
        ? (currentFocalWalletData?.outboundDayClusters || [])
        : (currentFocalWalletData?.outboundNodes || []);

      const allX = [...activeIn.map(n => Math.abs(n.worldX)), ...activeOut.map(n => Math.abs(n.worldX)), 460];
      const maxAbsX = Math.max(...allX);
      const requiredWidth = maxAbsX * 2 + 280;
      const requiredHeight = isMobileViewport() ? 760 : 1360;
      const scaleX = (rect.width * 0.94) / requiredWidth;
      const scaleY = (rect.height * 0.84) / requiredHeight;
      const targetCap = totalNodes > 12 ? 0.52 : 0.85;
      camZoom = Math.max(MIN_ZOOM_SCALE, Math.min(targetCap, Math.min(scaleX, scaleY)));
      camPanX = 0;
      camPanY = 0;
      updateWorldTransform(smooth);
    }

    viewportEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (isAnimatingNodeTransition) return;

      const rect = viewportEl.getBoundingClientRect();
      const cursorOffsetX = e.clientX - (rect.left + rect.width / 2);
      const cursorOffsetY = e.clientY - (rect.top + rect.height / 2);

      const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
      const nextZoom = Math.max(MIN_ZOOM_SCALE, Math.min(MAX_ZOOM_SCALE, camZoom * zoomFactor));

      const worldXUnderCursor = (cursorOffsetX - camPanX) / camZoom;
      const worldYUnderCursor = (cursorOffsetY - camPanY) / camZoom;

      camZoom = nextZoom;
      camPanX = cursorOffsetX - worldXUnderCursor * camZoom;
      camPanY = cursorOffsetY - worldYUnderCursor * camZoom;

      updateWorldTransform(false);
    }, { passive: false });

    // Mobile Two-Finger Pinch-to-Zoom Support
    let isPinching = false;
    let initialPinchDist = 0;
    let initialPinchZoom = 1;

    viewportEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        isPinching = true;
        isDraggingViewport = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.hypot(dx, dy);
        initialPinchZoom = camZoom;
      }
    }, { passive: true });

    viewportEl.addEventListener('touchmove', (e) => {
      if (isPinching && e.touches.length === 2 && initialPinchDist > 0) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const scaleRatio = dist / initialPinchDist;
        camZoom = Math.max(MIN_ZOOM_SCALE, Math.min(MAX_ZOOM_SCALE, initialPinchZoom * scaleRatio));
        updateWorldTransform(false);
      }
    }, { passive: false });

    viewportEl.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        isPinching = false;
      }
    }, { passive: true });

    viewportEl.addEventListener('pointerdown', (e) => {
      if (isAnimatingNodeTransition || isPinching) return;
      if (e.target.closest('.cyber-node') || e.target.closest('button') || e.target.closest('a')) return;

      isDraggingViewport = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragOriginPanX = camPanX;
      dragOriginPanY = camPanY;
      try { viewportEl.setPointerCapture(e.pointerId); } catch (err) {}
    });

    viewportEl.addEventListener('pointermove', (e) => {
      if (!isDraggingViewport || isPinching) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      camPanX = dragOriginPanX + dx;
      camPanY = dragOriginPanY + dy;
      updateWorldTransform(false);
    });

    viewportEl.addEventListener('pointerup', (e) => {
      if (isDraggingViewport) {
        isDraggingViewport = false;
        try { viewportEl.releasePointerCapture(e.pointerId); } catch (err) {}
      }
    });

    let isDraggingTimelineBox = false;
    let timelineDragStartX = 0;
    let timelineDragOriginPanX = 0;

    timelineViewportBoxEl.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (isAnimatingNodeTransition) return;
      isDraggingTimelineBox = true;
      timelineDragStartX = e.clientX;
      timelineDragOriginPanX = camPanX;
      try { timelineViewportBoxEl.setPointerCapture(e.pointerId); } catch (err) {}
    });

    timelineViewportBoxEl.addEventListener('pointermove', (e) => {
      if (!isDraggingTimelineBox) return;
      const trackRect = timelineTrackEl.getBoundingClientRect();
      if (!trackRect.width) return;

      const deltaTrackPx = e.clientX - timelineDragStartX;
      const deltaWorldX = (deltaTrackPx / trackRect.width) * (WORLD_TIMELINE_HALF_SPAN_X * 2);
      camPanX = timelineDragOriginPanX - deltaWorldX * camZoom;
      updateWorldTransform(false);
    });

    timelineViewportBoxEl.addEventListener('pointerup', (e) => {
      if (isDraggingTimelineBox) {
        isDraggingTimelineBox = false;
        try { timelineViewportBoxEl.releasePointerCapture(e.pointerId); } catch (err) {}
      }
    });

    timelineTrackEl.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#timeline-viewport-box') || e.target.closest('[data-tick-for]')) return;
      if (isAnimatingNodeTransition) return;
      const trackRect = timelineTrackEl.getBoundingClientRect();
      if (!trackRect.width) return;

      const clickRatio = Math.max(0, Math.min(1, (e.clientX - trackRect.left) / trackRect.width));
      const targetWorldX = (clickRatio - 0.5) * (WORLD_TIMELINE_HALF_SPAN_X * 2);
      camPanX = -targetWorldX * camZoom;
      updateWorldTransform(true);
    });

    document.getElementById('zoom-in-btn').addEventListener('click', () => {
      camZoom = Math.min(MAX_ZOOM_SCALE, camZoom * 1.22);
      updateWorldTransform(true);
    });

    document.getElementById('zoom-out-btn').addEventListener('click', () => {
      camZoom = Math.max(MIN_ZOOM_SCALE, camZoom / 1.22);
      updateWorldTransform(true);
    });

    document.getElementById('zoom-closest-btn').addEventListener('click', () => {
      fitClosestSixToViewport(true);
    });

    document.getElementById('zoom-fit-btn').addEventListener('click', () => {
      fitAllNodesToViewport(true);
    });

    document.getElementById('zoom-center-btn').addEventListener('click', () => {
      focusCenterNodeZoom(true);
    });

    const lodModeToggleBtn = document.getElementById('lod-mode-toggle');
    if (lodModeToggleBtn) {
      lodModeToggleBtn.addEventListener('click', () => {
        if (lodGroupingMode === 'auto') {
          lodGroupingMode = 'day';
          showToast('LOD VIEW: LOCKED TO DAY GROUPING');
        } else if (lodGroupingMode === 'day') {
          lodGroupingMode = 'individual';
          showToast('LOD VIEW: LOCKED TO INDIVIDUAL NODES');
        } else {
          lodGroupingMode = 'auto';
          showToast('LOD VIEW: AUTOMATIC BY ZOOM LEVEL');
        }
        isCurrentlyDayGrouped = shouldUseDayGrouping();
        if (currentFocalWalletData) {
          renderWalletGraphDOM(currentFocalWalletData, false);
        }
        updateLodBadgeUI();
        syncTimelineViewportAndMarkers();
      });
    }

    window.addEventListener('resize', () => {
      renderStaticTokenBrickWall();
      syncTimelineViewportAndMarkers();
      drawHoverLaserGuideline();
    });

    /***************************************************************************
     * 7. BREADCRUMBS, LASER GUIDELINE, TIMELINE VIEWPORT SYNC & SIDE OVERFLOW PANELS
     ***************************************************************************/
    function renderBreadcrumbs() {
      if (!breadcrumbsEl) return;
      breadcrumbsEl.innerHTML = '';

      const trailToShow = isMobileViewport()
        ? walletHistoryTrail.slice(-2)
        : walletHistoryTrail;

      trailToShow.forEach((item, idx) => {
        const isLast = idx === trailToShow.length - 1;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = isLast
          ? 'px-1.5 sm:px-2 py-0.5 bg-[#ff9900]/20 text-[#ff9900] border border-[#ff9900]/70 font-mono-code text-[9px] sm:text-[10px] font-bold shrink-0 cursor-default'
          : 'px-1.5 sm:px-2 py-0.5 bg-zinc-950 hover:bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800 font-mono-code text-[9px] sm:text-[10px] shrink-0 cursor-pointer transition';
        btn.textContent = formatShortHash(item.address);
        btn.title = item.address;

        if (!isLast) {
          btn.addEventListener('click', async () => {
            if (isAnimatingNodeTransition) return;
            const fullIdx = walletHistoryTrail.findIndex(w => w.address.toLowerCase() === item.address.toLowerCase());
            if (fullIdx >= 0) {
              walletHistoryTrail = walletHistoryTrail.slice(0, fullIdx + 1);
            }
            renderBreadcrumbs();
            const graphData = await getOrCreateWalletGraph(item.address);
            renderWalletGraphDOM(graphData, true);
            fitClosestSixToViewport(true);
          });
        }

        breadcrumbsEl.appendChild(btn);

        if (!isLast) {
          const sep = document.createElement('span');
          sep.className = 'text-zinc-600 font-mono-code text-[10px] select-none';
          sep.textContent = '>';
          breadcrumbsEl.appendChild(sep);
        }
      });
    }

    function setNodeAndTimelineHighlight(nodeId, isHighlighted) {
      activeHoverNodeId = isHighlighted ? nodeId : null;

      const nodeEl = document.getElementById(nodeId);
      if (nodeEl) {
        if (isHighlighted) nodeEl.classList.add('timeline-highlighted');
        else nodeEl.classList.remove('timeline-highlighted');
      }

      const pathEl = svgCurvesGroup.querySelector(`path[data-connector-for="${nodeId}"]`);
      const chevEl = svgCurvesGroup.querySelector(`path[data-chevron-for="${nodeId}"]`);
      if (pathEl) {
        const isInbound = nodeId.startsWith('inbound');
        const activeClass = isInbound ? 'connector-active-inbound' : 'connector-active-outbound';
        if (isHighlighted) {
          pathEl.classList.add(activeClass, 'flow-Overlay-anim');
          if (chevEl) chevEl.classList.add(activeClass);
        } else {
          pathEl.classList.remove(activeClass, 'flow-Overlay-anim');
          if (chevEl) chevEl.classList.remove(activeClass);
        }
      }

      const tickEl = timelineTicksLayer.querySelector(`[data-tick-for="${nodeId}"]`);
      if (tickEl) {
        if (isHighlighted) {
          tickEl.style.transform = 'translate(-50%, -50%) scale(1.65)';
          tickEl.style.zIndex = '50';
          tickEl.style.boxShadow = '0 0 12px #fcee0a';
        } else {
          tickEl.style.transform = 'translate(-50%, -50%) scale(1)';
          tickEl.style.zIndex = '20';
          tickEl.style.boxShadow = '';
        }
      }

      drawHoverLaserGuideline();
    }

    function drawHoverLaserGuideline() {
      if (!svgHoverGuideline) return;
      svgHoverGuideline.innerHTML = '';
      if (!activeHoverNodeId || isAnimatingNodeTransition) return;

      const nodeEl = document.getElementById(activeHoverNodeId);
      const tickEl = timelineTicksLayer.querySelector(`[data-tick-for="${activeHoverNodeId}"]`);
      if (!nodeEl || !tickEl) return;

      const vpRect = viewportEl.getBoundingClientRect();
      const nodeRect = nodeEl.getBoundingClientRect();
      const tickRect = tickEl.getBoundingClientRect();

      const startX = (nodeRect.left + nodeRect.width / 2) - vpRect.left;
      const startY = nodeRect.bottom - vpRect.top;
      const endX = (tickRect.left + tickRect.width / 2) - vpRect.left;
      const endY = vpRect.height;

      const isInbound = activeHoverNodeId.startsWith('inbound');
      const isCenter = activeHoverNodeId === 'center-focal-node';
      const strokeColor = isCenter ? '#ff9900' : (isInbound ? '#ff0055' : '#00ffaa');

      const midY = startY + (endY - startY) * 0.65;
      const d = `M ${startX.toFixed(1)} ${startY.toFixed(1)} L ${startX.toFixed(1)} ${midY.toFixed(1)} L ${endX.toFixed(1)} ${midY.toFixed(1)} L ${endX.toFixed(1)} ${endY.toFixed(1)}`;

      const laserPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      laserPath.setAttribute('d', d);
      laserPath.setAttribute('fill', 'none');
      laserPath.setAttribute('stroke', strokeColor);
      laserPath.setAttribute('stroke-width', '1.6');
      laserPath.setAttribute('stroke-dasharray', '4 4');
      laserPath.style.opacity = '0.88';
      svgHoverGuideline.appendChild(laserPath);
    }

    function syncTimelineViewportAndMarkers() {
      if (!viewportEl || !timelineTrackEl || !timelineViewportBoxEl) return;

      const vpRect = viewportEl.getBoundingClientRect();
      if (!vpRect.width || !vpRect.height) return;

      const halfSpan = Math.max(600, WORLD_TIMELINE_HALF_SPAN_X);
      const totalWorldSpan = halfSpan * 2;

      const leftWorldX = (-vpRect.width / 2 - camPanX) / camZoom;
      const rightWorldX = (vpRect.width / 2 - camPanX) / camZoom;

      let leftRatio = (leftWorldX + halfSpan) / totalWorldSpan;
      let rightRatio = (rightWorldX + halfSpan) / totalWorldSpan;

      leftRatio = Math.max(0, Math.min(0.96, leftRatio));
      rightRatio = Math.max(leftRatio + 0.04, Math.min(1, rightRatio));

      timelineViewportBoxEl.style.left = `${(leftRatio * 100).toFixed(2)}%`;
      timelineViewportBoxEl.style.width = `${((rightRatio - leftRatio) * 100).toFixed(2)}%`;

      updateSideOverflowPanels(vpRect);
    }

    function updateSideOverflowPanels(vpRect) {
      if (!currentFocalWalletData || isAnimatingNodeTransition || isMobileViewport()) {
        leftOverflowPanelEl.classList.add('panel-hidden');
        rightOverflowPanelEl.classList.add('panel-hidden');
        return;
      }

      const centerScreenX = vpRect.width / 2 + camPanX;
      const centerScreenY = vpRect.height / 2 + camPanY;

      const outOfFovInbound = [];
      const outOfFovOutbound = [];

      (currentFocalWalletData.inboundNodes || []).forEach(node => {
        const sx = centerScreenX + node.worldX * camZoom;
        const sy = centerScreenY + node.worldY * camZoom;
        if (sx < 30 || sx > vpRect.width - 30 || sy < 24 || sy > vpRect.height - 24) {
          outOfFovInbound.push(node);
        }
      });

      (currentFocalWalletData.outboundNodes || []).forEach(node => {
        const sx = centerScreenX + node.worldX * camZoom;
        const sy = centerScreenY + node.worldY * camZoom;
        if (sx < 30 || sx > vpRect.width - 30 || sy < 24 || sy > vpRect.height - 24) {
          outOfFovOutbound.push(node);
        }
      });

      if (outOfFovInbound.length > 0) {
        leftOverflowPanelEl.classList.remove('panel-hidden');
        leftOverflowCountEl.textContent = String(outOfFovInbound.length);
        leftOverflowListEl.innerHTML = '';

        outOfFovInbound.forEach(node => {
          const itemEl = document.createElement('div');
          itemEl.className = 'overflow-item-inbound px-2 py-1.5 font-mono-code text-[10px]';
          const fiatStr = formatUsdInSelectedCurrency(
            node.amountUsd !== undefined ? node.amountUsd : (node.amountEth * liveEthUsdPrice)
          );
          itemEl.innerHTML = `
            <div class="flex items-center justify-between font-bold text-white">
              <span>${formatShortHash(node.address)}</span>
              <span class="text-[#ff3377]">[IN]</span>
            </div>
            <div class="text-[#ff3377] font-semibold truncate">${fiatStr}</div>
            <div class="text-[9px] text-zinc-400 truncate">${node.dateStr} UTC</div>
          `;
          itemEl.addEventListener('mouseenter', () => setNodeAndTimelineHighlight(node.id, true));
          itemEl.addEventListener('mouseleave', () => setNodeAndTimelineHighlight(node.id, false));
          itemEl.addEventListener('click', (e) => {
            e.stopPropagation();
            selectAndSlideNodeToCenter(node, 'inbound');
          });
          leftOverflowListEl.appendChild(itemEl);
        });
      } else {
        leftOverflowPanelEl.classList.add('panel-hidden');
      }

      if (outOfFovOutbound.length > 0) {
        rightOverflowPanelEl.classList.remove('panel-hidden');
        rightOverflowCountEl.textContent = String(outOfFovOutbound.length);
        rightOverflowListEl.innerHTML = '';

        outOfFovOutbound.forEach(node => {
          const itemEl = document.createElement('div');
          itemEl.className = 'overflow-item-outbound px-2 py-1.5 font-mono-code text-[10px]';
          const fiatStr = formatUsdInSelectedCurrency(
            node.amountUsd !== undefined ? node.amountUsd : (node.amountEth * liveEthUsdPrice)
          );
          itemEl.innerHTML = `
            <div class="flex items-center justify-between font-bold text-white">
              <span>${formatShortHash(node.address)}</span>
              <span class="text-[#00ffaa]">[OUT]</span>
            </div>
            <div class="text-[#55ffcc] font-semibold truncate">${fiatStr}</div>
            <div class="text-[9px] text-zinc-400 truncate">${node.dateStr} UTC</div>
          `;
          itemEl.addEventListener('mouseenter', () => setNodeAndTimelineHighlight(node.id, true));
          itemEl.addEventListener('mouseleave', () => setNodeAndTimelineHighlight(node.id, false));
          itemEl.addEventListener('click', (e) => {
            e.stopPropagation();
            selectAndSlideNodeToCenter(node, 'outbound');
          });
          rightOverflowListEl.appendChild(itemEl);
        });
      } else {
        rightOverflowPanelEl.classList.add('panel-hidden');
      }
    }

    /***************************************************************************
     * 8. GRAPH DOM RENDERER, 90-DEGREE ORTHOGONAL CONNECTORS & TIMELINE MARKERS
     ***************************************************************************/
    function buildOrthogonalPathData(x1, y1, x2, y2, midX) {
      const dPath = `M ${x1.toFixed(1)} ${y1.toFixed(1)} L ${midX.toFixed(1)} ${y1.toFixed(1)} L ${midX.toFixed(1)} ${y2.toFixed(1)} L ${x2.toFixed(1)} ${y2.toFixed(1)}`;
      const arrowX = (x1 + midX) / 2;
      const arrowY = y1;
      const sz = 5.5;
      const dChevron = `M ${(arrowX - sz).toFixed(1)} ${(arrowY - sz).toFixed(1)} L ${(arrowX + sz * 0.4).toFixed(1)} ${arrowY.toFixed(1)} L ${(arrowX - sz).toFixed(1)} ${(arrowY + sz).toFixed(1)}`;
      return { dPath, dChevron };
    }

    function renderOrthogonalConnectors(activeInbound, activeOutbound, fadeInNew = false) {
      svgCurvesGroup.innerHTML = '';

      const centerHalfW = 176;
      const centerHalfH = 92;

      activeInbound.forEach((node, i) => {
        const nodeHalfW = node.isDayCluster ? 102 : 88;
        const startX = node.worldX + nodeHalfW;
        const startY = node.worldY;
        const endX = -centerHalfW;
        const count = Math.max(1, activeInbound.length);
        const portRatio = count === 1 ? 0 : ((i / (count - 1)) * 2 - 1);
        const endY = Math.round(portRatio * (centerHalfH * 0.78));

        const channelSpread = ((i % 9) - 4) * 9;
        const midX = Math.min(endX - 24, Math.max(startX + 18, (startX + endX) * 0.52 + channelSpread));

        const { dPath, dChevron } = buildOrthogonalPathData(startX, startY, endX, endY, midX);

        const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        pathEl.setAttribute('d', dPath);
        pathEl.setAttribute('class', 'connector-path-inbound');
        pathEl.dataset.connectorFor = node.id;

        const chevEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        chevEl.setAttribute('d', dChevron);
        chevEl.setAttribute('class', 'connector-chevron-inbound');
        chevEl.dataset.chevronFor = node.id;

        if (fadeInNew) {
          pathEl.style.opacity = '0';
          chevEl.style.opacity = '0';
          requestAnimationFrame(() => {
            pathEl.style.opacity = '1';
            chevEl.style.opacity = '1';
          });
        }

        svgCurvesGroup.appendChild(pathEl);
        svgCurvesGroup.appendChild(chevEl);
      });

      activeOutbound.forEach((node, i) => {
        const nodeHalfW = node.isDayCluster ? 102 : 88;
        const startX = centerHalfW;
        const count = Math.max(1, activeOutbound.length);
        const portRatio = count === 1 ? 0 : ((i / (count - 1)) * 2 - 1);
        const startY = Math.round(portRatio * (centerHalfH * 0.78));

        const endX = node.worldX - nodeHalfW;
        const endY = node.worldY;

        const channelSpread = ((i % 9) - 4) * 9;
        const midX = Math.max(startX + 24, Math.min(endX - 18, (startX + endX) * 0.48 + channelSpread));

        const { dPath, dChevron } = buildOrthogonalPathData(startX, startY, endX, endY, midX);

        const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        pathEl.setAttribute('d', dPath);
        pathEl.setAttribute('class', 'connector-path-outbound');
        pathEl.dataset.connectorFor = node.id;

        const chevEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        chevEl.setAttribute('d', dChevron);
        chevEl.setAttribute('class', 'connector-chevron-outbound');
        chevEl.dataset.chevronFor = node.id;

        if (fadeInNew) {
          pathEl.style.opacity = '0';
          chevEl.style.opacity = '0';
          requestAnimationFrame(() => {
            pathEl.style.opacity = '1';
            chevEl.style.opacity = '1';
          });
        }

        svgCurvesGroup.appendChild(pathEl);
        svgCurvesGroup.appendChild(chevEl);
      });
    }

     * 9. SMOOTH 3.5-SECOND PACED NODE SELECTION TRANSITION (ANTI-FREEZE & RATE-LIMIT SHIELD)
     ***************************************************************************/
    const PACED_NODE_TRANSITION_MS = 3500;

    function animatePacedNodeSlideToCenter(selectedEl, startWorldX, startWorldY, durationMs = PACED_NODE_TRANSITION_MS) {
      return new Promise((resolve) => {
        const startTime = performance.now();
        const initialPanX = camPanX;
        const initialPanY = camPanY;
        const initialZoom = camZoom;

        const rect = viewportEl.getBoundingClientRect();
        let targetZoom = isMobileViewport() ? 0.50 : 0.78;
        if (rect.width && rect.height) {
          if (isMobileViewport()) {
            targetZoom = Math.max(0.40, Math.min(0.68, Math.min((rect.width * 0.94) / 960, (rect.height * 0.85) / 680)));
          } else {
            const reqW = CLOSEST_SIX_WORLD_HALF_SPAN_X * 2 + 220;
            const reqH = 780;
            targetZoom = Math.max(0.62, Math.min(1.02, Math.min((rect.width * 0.92) / reqW, (rect.height * 0.88) / reqH)));
          }
        }

        const progressFillEl = selectedEl ? selectedEl.querySelector('.paced-sync-bar-fill') : null;
        const progressPctEl = selectedEl ? selectedEl.querySelector('.paced-sync-pct') : null;
        const phaseLabelEl = selectedEl ? selectedEl.querySelector('.paced-sync-phase') : null;

        worldLayerEl.classList.remove('smooth-camera-transition');

        function stepFrame(now) {
          const elapsed = now - startTime;
          const rawProgress = Math.min(1, elapsed / durationMs);

          const ease = rawProgress < 0.5
            ? 4 * rawProgress * rawProgress * rawProgress
            : 1 - Math.pow(-2 * rawProgress + 2, 3) / 2;

          const curNodeWorldX = startWorldX * (1 - ease);
          const curNodeWorldY = startWorldY * (1 - ease);
          if (selectedEl) {
            selectedEl.style.left = `${curNodeWorldX.toFixed(2)}px`;
            selectedEl.style.top = `${curNodeWorldY.toFixed(2)}px`;
            const scaleVal = 1 + 0.14 * Math.sin(rawProgress * Math.PI);
            selectedEl.style.transform = `translate(-50%, -50%) scale(${scaleVal.toFixed(3)})`;
          }

          camZoom = initialZoom + (targetZoom - initialZoom) * ease;
          const focusTrackingPanX = -curNodeWorldX * camZoom;
          const focusTrackingPanY = -curNodeWorldY * camZoom;
          camPanX = initialPanX * (1 - ease) + focusTrackingPanX * ease;
          camPanY = initialPanY * (1 - ease) + focusTrackingPanY * ease;

          worldLayerEl.style.transform = `translate3d(${camPanX.toFixed(2)}px, ${camPanY.toFixed(2)}px, 0) scale(${camZoom.toFixed(4)})`;
          zoomReadoutEl.textContent = `${Math.round(camZoom * 100)}%`;

          const pct = Math.min(100, Math.round(rawProgress * 100));
          if (progressFillEl) progressFillEl.style.width = `${pct}%`;
          if (progressPctEl) progressPctEl.textContent = `${pct}%`;
          if (phaseLabelEl) {
            if (pct < 35) {
              phaseLabelEl.textContent = 'LOCKING FOCAL WALLET // RATE-LIMIT SHIELD';
            } else if (pct < 75) {
              phaseLabelEl.textContent = 'FETCHING ETH + ERC-20 MAINNET LEDGER';
            } else {
              phaseLabelEl.textContent = 'MAPPING ORTHOGONAL TIMELINE NODES';
            }
          }

          setNetworkStatusBadge(`PACED MAINNET SYNC // ${pct}%`, false);
          syncTimelineViewportAndMarkers();

          if (rawProgress < 1) {
            requestAnimationFrame(stepFrame);
          } else {
            resolve();
          }
        }

        requestAnimationFrame(stepFrame);
      });
    }

    async function selectAndSlideNodeToCenter(clickedNode, direction) {
      if (isAnimatingNodeTransition) return;
      isAnimatingNodeTransition = true;
      activeHoverNodeId = null;
      svgHoverGuideline.innerHTML = '';

      const linkContext = {
        previousWallet: currentFocalWalletData,
        clickedDirection: direction,
        referenceTimestampMs: clickedNode.timestampMs
      };

      walletHistoryTrail.push({ address: clickedNode.address });
      renderBreadcrumbs();

      leftOverflowPanelEl.classList.add('panel-hidden');
      rightOverflowPanelEl.classList.add('panel-hidden');

      let selectedEl = document.getElementById(clickedNode.id);
      if (!selectedEl) {
        selectedEl = document.createElement('div');
        selectedEl.id = clickedNode.id;
        selectedEl.dataset.nodeId = clickedNode.id;
        selectedEl.className = `cyber-node ${direction === 'inbound' ? 'node-inbound' : 'node-outbound'} px-2.5 py-2 flex flex-col justify-center`;
        selectedEl.style.left = `${clickedNode.worldX}px`;
        selectedEl.style.top = `${clickedNode.worldY}px`;
        nodesContainerEl.appendChild(selectedEl);
      }

      const fiatAmountStr = formatUsdInSelectedCurrency(
        clickedNode.amountUsd !== undefined ? clickedNode.amountUsd : (clickedNode.amountEth * liveEthUsdPrice)
      );

      nodesContainerEl.querySelectorAll('.cyber-node').forEach(el => {
        if (el === selectedEl || el.dataset.nodeId === clickedNode.id) {
          el.classList.remove('fade-out-element', 'timeline-highlighted');
          el.classList.add('node-sliding-to-center');
        } else {
          el.classList.add('fade-out-element');
        }
      });

      svgCurvesGroup.querySelectorAll('path').forEach(pathEl => {
        pathEl.classList.add('fade-out-element');
      });

      selectedEl.innerHTML = `
        <div class="flex items-center justify-between border-b border-[#ff9900]/45 pb-1 mb-1">
          <span class="font-display text-[8px] font-extrabold uppercase tracking-widest text-[#ff9900]">
            CENTERING FOCAL WALLET
          </span>
          <span class="paced-sync-pct font-mono-code text-[10px] font-bold text-[#fcee0a]">0%</span>
        </div>
        <div class="font-mono-code text-xs font-bold text-white truncate" title="${clickedNode.address}">
          ${clickedNode.address}
        </div>
        <div class="flex items-center justify-between text-[9px] font-mono-code text-[#ffbb33] mt-0.5">
          <span>TX VALUE: ${fiatAmountStr}</span>
          <span class="uppercase">${direction}</span>
        </div>
        <div class="w-full h-1.5 bg-zinc-900 border border-[#ff9900]/60 mt-2 overflow-hidden">
          <div class="paced-sync-bar-fill h-full bg-gradient-to-r from-[#ff5500] via-[#ff9900] to-[#fcee0a] w-0"></div>
        </div>
        <div class="paced-sync-phase font-mono-code text-[8px] text-[#fcee0a] uppercase tracking-wider mt-1 truncate">
          LOCKING FOCAL WALLET // RATE-LIMIT SHIELD
        </div>
      `;

      const startWorldX = parseFloat(clickedNode.worldX) || 0;
      const startWorldY = parseFloat(clickedNode.worldY) || 0;

      const [newGraphData] = await Promise.all([
        getOrCreateWalletGraph(clickedNode.address, linkContext),
        animatePacedNodeSlideToCenter(selectedEl, startWorldX, startWorldY, PACED_NODE_TRANSITION_MS)
      ]);

      camPanX = 0;
      camPanY = 0;
      updateWorldTransform(false);

      renderWalletGraphDOM(newGraphData, true);
      fitClosestSixToViewport(true);

      setTimeout(() => {
        isAnimatingNodeTransition = false;
        syncTimelineViewportAndMarkers();
      }, 460);
    }

    const selectNodeAsCenter = selectAndSlideNodeToCenter;

    /***************************************************************************
     * 10. INITIAL HOMEPAGE SEARCH EXECUTION (3S RANDOM BRICK PUNCH-OUT & GRAPH ZOOM-IN)
     ***************************************************************************/
    const searchForm = document.getElementById('search-form');
    const hashInput = document.getElementById('hash-input');
    const landingView = document.getElementById('landing-view');
    const graphView = document.getElementById('graph-view');
    const backToSearchBtn = document.getElementById('back-to-search-btn');
    let isSearchTransitionRunning = false;

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isSearchTransitionRunning) return;
      isSearchTransitionRunning = true;

      unlockAudioOnFirstGesture();

      const queryHash = hashInput.value.trim() || '0x742d35Cc6634C0532925a3b844Bc454e4438f44e';

      landingView.classList.add('sink-away');

      walletHistoryTrail = [{ address: queryHash.startsWith('0x') ? queryHash : `0x${queryHash}` }];
      renderBreadcrumbs();

      const [initialGraphData] = await Promise.all([
        getOrCreateWalletGraph(queryHash),
        animateBricksPunchOut(3000)
      ]);

      bgCanvas.classList.add('sink-away');
      renderWalletGraphDOM(initialGraphData, false);

      graphView.classList.add('zoom-in-active');
      fitClosestSixToViewport(false);

      setTimeout(() => {
        syncTimelineViewportAndMarkers();
        isSearchTransitionRunning = false;
      }, 350);
    });

    backToSearchBtn.addEventListener('click', () => {
      isSearchTransitionRunning = false;
      graphView.classList.remove('zoom-in-active');
      renderStaticTokenBrickWall();

      setTimeout(() => {
        landingView.classList.remove('sink-away');
      }, 250);
    });
  </script>
</body>
</html>
