        timelineTicksLayer.appendChild(tick);
      });

      syncTimelineViewportAndMarkers();
    }

    // Update the soft yellow see-through square/box on the Timeline bar so it represents the exact horizontal world window visible on screen
    function syncTimelineViewportAndMarkers() {
      if (!currentFocalWalletData) return;
      const viewRect = viewportEl.getBoundingClientRect();
      if (!viewRect.width) return;

      // Calculate left and right edges of the user's current screen in World X coordinates
      // Since screenX = viewWidth/2 + camPanX + worldX * camZoom:
      // Left edge (screenX = 0)  => worldLeft  = (-viewWidth/2 - camPanX) / camZoom
      // Right edge (screenX = W) => worldRight = (+viewWidth/2 - camPanX) / camZoom
      const worldLeft = (-viewRect.width / 2 - camPanX) / camZoom;
      const worldRight = (viewRect.width / 2 - camPanX) / camZoom;

      const totalWorldSpan = WORLD_TIMELINE_HALF_SPAN_X * 2;
      const rawLeftPct = (0.5 + (worldLeft / totalWorldSpan)) * 100;
      const rawRightPct = (0.5 + (worldRight / totalWorldSpan)) * 100;

      const clampedLeftPct = Math.max(0, Math.min(98, rawLeftPct));
      const clampedRightPct = Math.max(clampedLeftPct + 2, Math.min(100, rawRightPct));
      const widthPct = clampedRightPct - clampedLeftPct;

      timelineViewportBoxEl.style.left = `${clampedLeftPct.toFixed(2)}%`;
      timelineViewportBoxEl.style.width = `${widthPct.toFixed(2)}%`;

      // Highlight markers that are currently inside the user's visible viewport window
      timelineTicksLayer.querySelectorAll('[data-tick-for]').forEach(tick => {
        const ratioPct = parseFloat(tick.dataset.timelineRatio || '0.5') * 100;
        const isInsideScreen = ratioPct >= clampedLeftPct && ratioPct <= clampedRightPct;
        tick.style.opacity = isInsideScreen ? '1' : '0.42';
      });
    }

    function setHoverNode(nodeId) {
      activeHoverNodeId = nodeId;

      // 1. Highlight matching node on the page
      nodesContainerEl.querySelectorAll('.cyber-node').forEach(nodeEl => {
        if (nodeEl.dataset.nodeId === nodeId) {
          nodeEl.classList.add('timeline-highlighted');
        } else {
          nodeEl.classList.remove('timeline-highlighted');
        }
      });

      // 2. Highlight matching marker on the timeline
      timelineTicksLayer.querySelectorAll('[data-tick-for]').forEach(tickEl => {
        const pill = tickEl.querySelector('.tick-pill');
        const tooltip = tickEl.querySelector('.timeline-tooltip');
        if (!pill) return;
        if (tickEl.dataset.tickFor === nodeId) {
          pill.classList.add('scale-150', 'ring-2', 'ring-[#fcee0a]');
          if (tooltip) tooltip.classList.remove('hidden');
          if (tooltip) tooltip.classList.add('flex');
        } else {
          pill.classList.remove('scale-150', 'ring-2', 'ring-[#fcee0a]');
          if (tooltip) tooltip.classList.add('hidden');
          if (tooltip) tooltip.classList.remove('flex');
        }
      });

      drawWorldOrthogonalConnectors(false);
      drawHoverLaserGuideline();
    }

    // Draw orthogonal screen-space laser line linking hovered node and its bottom timeline marker
    function drawHoverLaserGuideline() {
      svgHoverGuideline.innerHTML = '';
      if (!activeHoverNodeId || isAnimatingNodeTransition) return;

      const nodeEl = document.getElementById(activeHoverNodeId);
      const tickEl = timelineTicksLayer.querySelector(`[data-tick-for="${activeHoverNodeId}"]`);
      const viewRect = viewportEl.getBoundingClientRect();
      if (!nodeEl || !tickEl || !viewRect.width) return;

      const nRect = nodeEl.getBoundingClientRect();
      const tRect = tickEl.getBoundingClientRect();

      const x1 = Math.round(nRect.left - viewRect.left + nRect.width / 2);
      const y1 = Math.round(nRect.bottom - viewRect.top);
      const x2 = Math.round(tRect.left - viewRect.left + tRect.width / 2);
      const y2 = Math.round(viewRect.height);

      let strokeColor = '#ff9900';
      if (activeHoverNodeId.startsWith('inbound')) strokeColor = '#ff0055';
      if (activeHoverNodeId.startsWith('outbound')) strokeColor = '#00ffaa';

      const midY = Math.round(y2 - 14);
      const guidePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      guidePath.setAttribute('d', `M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}`);
      guidePath.setAttribute('fill', 'none');
      guidePath.setAttribute('stroke', strokeColor);
      guidePath.setAttribute('stroke-width', '1.8');
      guidePath.setAttribute('stroke-dasharray', '4 4');
      svgHoverGuideline.appendChild(guidePath);
    }

    /***************************************************************************
     * 9. SMOOTH NODE SELECTION TRANSITION:
     *    - DO NOT sink away or transition to black!
     *    - Fade out all other nodes & old connectors
     *    - Slide the selected node directly into the center view
     *    - Fade in the new node's connections
     ***************************************************************************/
    async function selectAndSlideNodeToCenter(clickedNode, direction) {
      if (isAnimatingNodeTransition) return;
      isAnimatingNodeTransition = true;
      activeHoverNodeId = null;
      svgHoverGuideline.innerHTML = '';

      const linkContext = {
        previousWallet: currentFocalWalletData,
        clickedDirection: direction,
        referenceTimestampMs: clickedNode.timestampMs
      };

      walletHistoryTrail.push({ address: clickedNode.address });
      renderBreadcrumbs();

      // 1. Fade out all unselected nodes and all existing orthogonal connector lines
      nodesContainerEl.querySelectorAll('.cyber-node').forEach(el => {
        if (el.dataset.nodeId === clickedNode.id) {
          el.classList.add('node-sliding-to-center');
        } else {
          el.classList.add('fade-out-element');
        }
      });

      svgCurvesGroup.querySelectorAll('path').forEach(pathEl => {
        pathEl.classList.add('fade-out-element');
      });

      // 2. Simultaneously slide the selected node smoothly into the exact center of the viewport (0, 0)
      camPanX = -clickedNode.worldX * camZoom;
      camPanY = -clickedNode.worldY * camZoom;
      updateWorldTransform(true);

      // 3. Wait for the smooth camera slide-to-center animation (580ms) while computing new wallet graph
      const [newGraphData] = await Promise.all([
        getOrCreateWalletGraph(clickedNode.address, linkContext),
        new Promise(resolve => setTimeout(resolve, 590))
      ]);

      // 4. Seamlessly reset world origin (0,0) at the center of the screen and fade in the new connections
      camPanX = 0;
      camPanY = 0;
      updateWorldTransform(false);

      renderWalletGraphDOM(newGraphData, true);
      focusCenterNodeZoom(true);

      setTimeout(() => {
        isAnimatingNodeTransition = false;
        syncTimelineViewportAndMarkers();
      }, 460);
    }

    /***************************************************************************
     * 10. INITIAL HOMEPAGE SEARCH EXECUTION (3S RANDOM BRICK PUNCH-OUT & GRAPH ZOOM-IN)
     ***************************************************************************/
    const searchForm = document.getElementById('search-form');
    const hashInput = document.getElementById('hash-input');
    const landingView = document.getElementById('landing-view');
    const graphView = document.getElementById('graph-view');
    const backToSearchBtn = document.getElementById('back-to-search-btn');
    let isSearchTransitionRunning = false;

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isSearchTransitionRunning) return;
      isSearchTransitionRunning = true;

      unlockAudioOnFirstGesture();

      const queryHash = hashInput.value.trim() || '0x742d35Cc6634C0532925a3b844Bc454e4438f44e';

      // 1. Sink & fade away the foreground title and search bar while each brick in the background wall is punched out individually over 3 seconds
      landingView.classList.add('sink-away');

      // 2. Prepare initial graph data in parallel with the 3-second brick punch-out animation
      walletHistoryTrail = [{ address: queryHash.startsWith('0x') ? queryHash : `0x${queryHash}` }];
      renderBreadcrumbs();

      const [initialGraphData] = await Promise.all([
        getOrCreateWalletGraph(queryHash),
        animateBricksPunchOut(3000)
      ]);

      bgCanvas.classList.add('sink-away');
      renderWalletGraphDOM(initialGraphData, false);

      // 3. Zoom flowchart nodes and timeline into view after the bricks have punched out, starting zoomed in on the Center Selected Node
      graphView.classList.add('zoom-in-active');
      focusCenterNodeZoom(false);

      setTimeout(() => {
        syncTimelineViewportAndMarkers();
        isSearchTransitionRunning = false;
      }, 350);
    });

    // Return to Homepage Search Screen (Audio continues playing persistently)
    backToSearchBtn.addEventListener('click', () => {
      isSearchTransitionRunning = false;
      graphView.classList.remove('zoom-in-active');
      renderStaticTokenBrickWall();

      setTimeout(() => {
        landingView.classList.remove('sink-away');
      }, 250);
    });
  </script>
</body>
</html>
